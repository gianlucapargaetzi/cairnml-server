# Resource-aware scheduling: placement, offers, lost workers and the bounds of task requirements.

# How often the server runs a placement pass when nothing else triggers one (seconds)
placement_interval_sec: 15

# How often an agent syncs with the server (seconds). The server expects it at this rate.
sync_interval_sec: 10

# An offer that the agent has not claimed in this time goes back to pending (seconds)
offer_expiry_sec: 60

# A worker that has not synced for this many intervals is lost
lost_after_missed_syncs: 3

# How often the server looks for lost workers and expired offers, on its own timer, whether or not a placement
# pass runs (seconds). 0 turns the timer off, and lost workers are then found only by a placement pass.
sweep_interval_sec: 15

# Attempts per task: the first run plus one retry when the worker is lost
max_attempts: 2

# Default priority of a task (0 to 100, higher runs first)
default_priority: 50

# Priority points added per hour a task has waited. 0 turns aging off.
aging_points_per_hour: 0

# Upper bounds for requirements a task may ask for
max_requirements {
  cpus: 512
  ram_gb: 4096
  gpus: 64
  disk_gb: 100000
  max_runtime_min: 525600
}

# Default host reserve of a worker, when the agent does not set one
default_reserve {
  cpus: 1
  ram_percent: 10
  disk_percent: 10
}

# Scheduler events older than this are removed (days)
event_retention_days: 30
