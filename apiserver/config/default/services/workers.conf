# Seconds without a report after which an agent (worker) is dropped from the server's registry
# and shown as offline. Agents that do not send their own timeout use this value.
# Must agree with apiserver.workers.default_timeout and the workers.register schema default.
default_worker_timeout_sec: 3600
default_cluster_timeout_sec: 600

# The minimal sampling interval for resource dashboard and worker activity charts
min_chart_interval_sec: 40

stats {
    max_metrics_concurrency: 4
}