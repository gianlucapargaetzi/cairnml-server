{
    watch: false            # Watch for changes (dev only)
    debug: false            # Debug mode
    pretty_json: false      # prettify json response
    return_stack: false      # return stack trace on error
    return_stack_to_caller: false # top-level control on whether to return stack trace in an API response

    # if 'return_stack' is true and error contains a status code, return stack trace only for these status codes
    # valid values are:
    #  - an integer number, specifying a status code
    #  - a tuple of (code, subcode or list of subcodes)
    return_stack_on_code: [
        [500, 0]  # raise on internal server error with no subcode
    ]

    listen {
        ip : "0.0.0.0"
        port: 8008
    }

    version {
        required: false
        default: 1.0
        # if set then calls to endpoints with the version
        # greater that the current max version will be rejected
        check_max_version: false
    }

    pre_populate {
        enabled: false
        zip_files: ["/path/to/export.zip"]
        fail_on_error: false
    }

    # time in seconds to take an exclusive lock to init es and mongodb
    # not including the pre_populate
    db_init_timout: 120

    mongo {
        # controls whether FieldDoesNotExist exception will be raised for any extra attribute existing in stored data
        # but not declared in a data model
        strict: false
        ensure_db_version_on_startup: true
    }

    elastic {
        probing {
            # settings for inital probing of elastic connection
            max_retries: 4
            timeout: 30
        }
        upgrade_monitoring {
            v16_migration_verification: true
        }
    }

    auth {
        # If set then users that were created from secure credentials or fixed user settings and are no longer in these settings will be deleted on startup
        delete_missing_autocreated_users: true

        # max token expiration timeout in seconds (1 year)
        max_expiration_sec: 31536000

        # default token expiration timeout in seconds (30 days)
        default_expiration_sec: 2592000

        # cookie containing auth token, for requests arriving from a web-browser
        session_auth_cookie_name: "cairnml_token_basic"

        # cookie configuration for authorization cookies generated by auth.login
        cookies {
            httponly: true  # allow only http to access the cookies (no JS etc)
            secure: false   # not using HTTPS
            domain: null    # Limit to localhost is not supported
            samesite: Strict  # the session cookie is never sent on cross-site requests
            path: "/cairnml"  # only CairnML's own addresses get the cookie, not other sites on the same machine
            max_age: 99999999999
        }

        # The ID token of the web sign-in (see idp/web_login.py). The browser sends it only on the logout call, which is
        # its path, so the identity provider can end that session at logout without asking to confirm it.
        custom_cookies {
            idp_session {
                enabled: true
                name: "cairnml_idp_session"
                settings {
                    httponly: true
                    secure: false
                    domain: null
                    samesite: Strict
                    max_age: 36000
                    path: "/cairnml/api/v999.0/login.logout"
                }
            }
        }

        # provide a cookie domain override per company
#        cookies_domain_override {
#            <company-id>: <domain>
#        }

    }

    # Object storage (RustFS, S3 API). Uploads and downloads go straight between the client and the
    # store through presigned URLs. The server's own calls use endpoint; presigned URLs name
    # public_endpoint, which clients must reach. Empty: the address the client used, on public_port.
    # The secret is read from the secrets folder as s3_secret_key, never from this file.
    storage {
        endpoint: "http://rustfs:9000"
        public_endpoint: ""
        # The port the clients reach the store on, when public_endpoint is empty (the host the client used, on this port).
        public_port: 9000
        region: "us-east-1"
        access_key: "cairnml-server"
        presign_ttl_sec: 900
        # Objects at or above this size are uploaded in parts. A single PUT is limited to 5 GiB.
        multipart_threshold_bytes: 5368709120
        # Size of each part (S3 needs at least 5 MiB for every part but the last; at most 10000 parts).
        multipart_part_bytes: 67108864
        # How long the keys for the dataset bucket (used by DVC) stay valid. RustFS allows 15 minutes to 12 hours.
        dataset_credentials_ttl_sec: 3600
    }

    # The dataset registry: the repository (owner/name) with one file per dataset, and the owners whose dataset
    # repositories may be registered in it. Empty means registration is off.
    dataset_registry {
        repository: ""
        allowed_owners: []
    }

    # Cross-origin browser access. The web app is served from the API's own origin, so it needs none. Name the origins
    # that may call the API from a browser, e.g. ["https://app.example"]. The configured web_url origin is added
    # automatically. A wildcard cannot be combined with supports_credentials; the server refuses to start.
    cors {
        origins: []

        supports_credentials: false
    }

    default_company: "d1bd92a3b039400cbafc60a7a5b1e52b"

    workers {
        # Auto-register unknown workers on status reports and other calls
        auto_register: true
        # Assume unknow workers have unregistered (i.e. do not raise unregistered error)
        auto_unregister: true
        # Timeout in seconds on task status update. If exceeded
        # then task can be stopped without communicating to the worker
        task_update_timeout: 600

        # Timeout in seconds for worker registration (or status report). If a worker did not report for this long,
        # it is discarded from the server's table
        default_timeout: 600
    }

    check_for_updates {
        # CairnML sends nothing to the ClearML update service
        enabled: false

        # Check for updates every 24 hours
        check_interval_sec: 86400

        url: ""

        component_name: "cairnml-server"

        # GET request timeout
        request_timeout_sec: 3.0
    }

    statistics {
        # Note: statistics are sent ONLY if the user has actively opted-in
        supported: false

        url: ""

        report_interval_hours: 24
        agent_relevant_threshold_days: 30

        max_retries: 5
        max_backoff_sec: 5
    }

    # The end-to-end suite's reset (system.e2e_reset). Off unless a deployment is a test stack that the suite owns:
    # the reset deletes every project, task and worker whose name starts with name_prefix. Only the suite's own
    # compose file turns it on (tests/e2e/stack/compose.yaml).
    e2e {
        reset_enabled: false
        name_prefix: "e2e"
    }

    getting_started_info {
        "agentName": "cairnml",
        "configure": "cairnml init <server>",
        "install": "pip install cairnml",
        "packageName": "cairnml"
    }

    # Identity provider (Keycloak) for sign-in and admin checks. issuer is the address the server itself uses;
    # clients get the proxy's address for it. public_url and web_url are empty: the address the client used.
    idp {
        issuer: "http://cairnml-idp:8180/cairnml/idp/realms/cairnml"
        # Everything is reached under this path of the address the client used: the API at <path>/api, the web app
        # at <path>/, the identity provider at <path>/idp.
        public_path: "/cairnml"
        public_url: ""
        web_client_id: "cairnml-web"
        sdk_client_id: "cairnml-sdk"
        directory_client_id: "cairnml-server"
        admin_role: "cairnml-admin"
        sync_interval_sec: 60
        access_token_ttl_sec: 900
        job_token_ttl_sec: 3600
        company_name: "cairnml"
    jwks_file: ""
    sync_enabled: true
    web_url: ""
    github_app_id: ""
    github_api_url: "https://api.github.com"
    }
}
