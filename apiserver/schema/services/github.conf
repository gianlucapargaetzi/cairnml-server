_description: """The GitHub App of the server: whether its ID and key work, and what the key reaches."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

status {
    "2.38" {
        description: """The last check of the GitHub App: state (ok, refused, unreachable, not_configured or unknown) and a one-line message for the banner. Every signed-in user gets the state and the message; if something does not work the message says to contact an admin. Admins also get the steps of the check, the App, its repositories and the dataset registries with their dataset counts. The check runs when the server starts and on github.check."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                status {
                    type: object
                }
            }
        }
    }
}

check {
    "2.38" {
        description: """Runs the GitHub App check now and returns its result, with the steps. Admins only."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                status {
                    type: object
                }
            }
        }
    }
}
