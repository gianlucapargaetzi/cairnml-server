_description: """Import a run from a standard ZIP. The ZIP is staged in object storage (prepare_upload, then the bytes, then commit), and run creates one new task from it in the project named by its manifest. Import never overwrites a task. Only the user who staged an upload can use it."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

prepare_upload {
    "2.39" {
        description: """Record a staging upload for a run's ZIP and return a presigned PUT URL for its bytes. A large ZIP gets a multipart upload, with one presigned URL per part (prepare_part). The headers returned must be sent with the PUT. Size and sha256 are bound to the URL. An upload that is not imported within 24 hours is removed."""
        request {
            type: object
            required: ["name", "size", "sha256"]
            properties {
                name { type: string }
                size { type: integer, minimum: 0 }
                sha256 { type: string, pattern: "^[0-9a-f]{64}$" }
                content_type { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                id { type: string }
                method { type: string }
                url { type: string }
                headers { type: object }
                multipart {
                    type: object
                    properties {
                        part_bytes { type: integer }
                        parts { type: integer }
                    }
                }
                expires_at { type: string }
            }
        }
    }
}

prepare_part {
    "2.39" {
        description: """A presigned PUT for one part of a multipart staging upload. Only the user who asked for the upload may use it."""
        request {
            type: object
            required: ["id", "part"]
            properties {
                id { type: string }
                part { type: integer, minimum: 1 }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                id { type: string }
                part { type: integer }
                method { type: string }
                url { type: string }
                headers { type: object }
                expires_at { type: string }
            }
        }
    }
}

commit {
    "2.39" {
        description: """Check the stored ZIP against its record (size and sha256). A multipart upload is completed from its parts first. A mismatch deletes the object."""
        request {
            type: object
            required: ["id"]
            properties {
                id { type: string }
                parts {
                    type: array
                    items {
                        type: object
                        required: ["number", "etag"]
                        properties {
                            number { type: integer, minimum: 1 }
                            etag { type: string }
                        }
                    }
                }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                id { type: string }
                state { type: string }
            }
        }
    }
}

run {
    "2.39" {
        description: """Import a stored ZIP as a new task. The manifest's project must exist and the user must have write access to it. The task gets the run's parameters, its scalars and its files as artifacts. On failure nothing is left behind and the upload can be imported again. On success the staged ZIP is removed."""
        request {
            type: object
            required: ["id"]
            properties {
                id { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                id { type: string }
                project { type: string }
                name { type: string }
                scalars { type: integer }
                artifacts { type: array, items { type: string } }
                warnings { type: array, items { type: string } }
            }
        }
    }
}
