_description: """The repository accesses a user owns: a token for a host, or a GitHub App. Only the owner sees them; no call returns a secret."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

get_all {
    "2.38" {
        description: """The signed-in user's own accesses (id, kind, label, host, path or App ID, last check, the projects they are shared with), the company's token credentials, which the user can use but not change, and the projects the user belongs to. No secret is returned."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                own { type: array, items { type: object } }
                company { type: array, items { type: object } }
            }
        }
    }
}

add_token {
    "2.38" {
        description: """Add a token for a host, optionally for one path prefix on it (such as an organisation). The token is encrypted at rest and is never returned. Other users use it only through repository resolution."""
        request {
            type: object
            required: [label, token]
            properties {
                label { type: string }
                host { type: string }
                path { type: string }
                token { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                access { type: object }
            }
        }
    }
}

add_app {
    "2.38" {
        description: """Add a GitHub App of the user: its label, App ID, API address (GitHub Enterprise; empty for github.com) and the App's private key (.pem). The key is checked with GitHub before it is saved, encrypted at rest, and never returned."""
        request {
            type: object
            required: [label, app_id, key]
            properties {
                label { type: string }
                app_id { type: string }
                api_url { type: string }
                key { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                access { type: object }
            }
        }
    }
}

delete {
    "2.38" {
        description: """Delete one of the user's accesses. Its secret is removed."""
        request {
            type: object
            required: [id]
            properties {
                id { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                deleted { type: boolean }
            }
        }
    }
}

check {
    "2.38" {
        description: """Check one of the user's accesses now: a token against GitHub, or an App against GitHub with the number of repositories it is installed on. The result is stored with the access."""
        request {
            type: object
            required: [id]
            properties {
                id { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                access { type: object }
            }
        }
    }
}

grant {
    "2.38" {
        description: """Share one of the user's accesses with a project the user belongs to. Its members may use the access in the project's tasks, and can never read its secret. The grant stops at once when the owner or the user leaves the project or is deactivated."""
        request {
            type: object
            required: [id, project]
            properties {
                id { type: string }
                project { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                access { type: object }
            }
        }
    }
}

revoke {
    "2.38" {
        description: """Stop sharing an access with a project. Allowed for the owner of the access, the owner of the project, and an admin."""
        request {
            type: object
            required: [id, project]
            properties {
                id { type: string }
                project { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                access { type: object }
            }
        }
    }
}

project_grants {
    "2.38" {
        description: """The accesses shared with a project, for its members: label, kind, what they reach, and the owner's name. Never the secret."""
        request {
            type: object
            required: [project]
            properties {
                project { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                grants { type: array, items { type: object } }
            }
        }
    }
}
