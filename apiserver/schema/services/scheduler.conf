_description: """Usage of the machines and the jobs, for the monitor: recorded from the workers' status reports."""

_default {
    internal: false
    allow_roles: ["*"]
    authorize: true
}

get_usage_history {
    "2.36" {
        description: """The usage of a worker's machine, or of a task's job, over the last minutes (default 60)."""
        request {
            type: object
            properties {
                worker { type: string }
                task { type: string }
                minutes { type: integer }
            }
        }
        response {
            type: object
            properties {
                points { type: array, items { type: object } }
            }
        }
    }
}
