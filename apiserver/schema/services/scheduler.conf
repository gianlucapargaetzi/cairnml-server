_description: """Resource-aware scheduling: workers register their capacity, the server offers them the tasks that fit,
the agent claims an offer and reports the end of the job. Agents call the first four; users call the rest."""

_default {
    internal: false
    allow_roles: ["*"]
    authorize: true
}

register_worker {
    "2.36" {
        description: """Register or update a worker (one physical machine). The capacity is the whole machine; reserved is kept for the host. Only the agent device that registered the worker may use it again."""
        request {
            type: object
            required: [worker, capacity]
            properties {
                worker { type: string }
                capacity { type: object }
                reserved { type: object }
                can_enforce { type: object }
                agent_version { type: string }
            }
        }
        response {
            type: object
            properties {
                id { type: string }
                state { type: string }
            }
        }
    }
}

sync {
    "2.36" {
        description: """Heartbeat of a worker. Carries the machine usage and the usage of each running job. Returns the offers for this worker and the jobs the server no longer expects (the agent stops them)."""
        request {
            type: object
            required: [worker]
            properties {
                worker { type: string }
                usage { type: object }
                jobs { type: array, items { type: object } }
            }
        }
        response {
            type: object
            properties {
                offers { type: array, items { type: object } }
                stop { type: array, items { type: string } }
            }
        }
    }
}

claim {
    "2.36" {
        description: """Take the offer for a task. The task starts (in_progress) and the agent may then ask for the job token."""
        request {
            type: object
            required: [worker, task]
            properties {
                worker { type: string }
                task { type: string }
            }
        }
        response {
            type: object
            properties {
                task { type: string }
                reservation { type: string }
            }
        }
    }
}

release {
    "2.36" {
        description: """A job ended. outcome is completed, stopped or failed. A failure carries its reason (for example oom, time_limit, gpu_error, disk_full, error) and a sentence for the user."""
        request {
            type: object
            required: [worker, task, outcome]
            properties {
                worker { type: string }
                task { type: string }
                outcome { type: string, enum: [completed, stopped, failed] }
                failure { type: object }
            }
        }
        response {
            type: object
            properties {
                task { type: string }
                outcome { type: string }
            }
        }
    }
}

get_overview {
    "2.36" {
        description: """Workers with their capacity, allocation and live usage, and the jobs running on each. One call for the Workers view."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
        }
    }
}

get_jobs {
    "2.36" {
        description: """Running and pending jobs in one flat list, with the reason a pending job waits."""
        request {
            type: object
            properties {
                state { type: string, enum: [running, pending] }
            }
        }
        response {
            type: object
        }
    }
}

get_events {
    "2.36" {
        description: """The latest scheduler events, newest first."""
        request {
            type: object
            properties {
                limit { type: integer }
            }
        }
        response {
            type: object
        }
    }
}

set_priority {
    "2.36" {
        description: """Set the priority of a pending task (0 to 100). The owner or an admin may do it."""
        request {
            type: object
            required: [task, priority]
            properties {
                task { type: string }
                priority { type: integer }
            }
        }
        response {
            type: object
        }
    }
}

drain_worker {
    "2.36" {
        description: """Stop a worker taking new jobs (drain: true) or let it take them again (drain: false). Its running jobs finish. Admins only."""
        request {
            type: object
            required: [worker]
            properties {
                worker { type: string }
                drain { type: boolean }
            }
        }
        response {
            type: object
        }
    }
}

get_usage_history {
    "2.36" {
        description: """The usage of a worker's machine, or of a task's job, over the last minutes (default 60)."""
        request {
            type: object
            properties {
                worker { type: string }
                task { type: string }
                minutes { type: integer }
            }
        }
        response {
            type: object
            properties {
                points { type: array, items { type: object } }
            }
        }
    }
}
