_description: """Devices (laptops and agents) that sign in through the identity provider and hold a device key."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

enroll {
    authorize: false
    "2.8" {
        description: """Register a device's public key. The request carries the identity provider's sign-in token as a bearer token. Agents may only be enrolled by an admin."""
        request {
            type: object
            required: ["public_key"]
            properties {
                kind { type: string, enum: ["client", "agent"] }
                name { type: string }
                public_key { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                id { type: string }
                kind { type: string }
            }
        }
    }
}

idp_settings {
    authorize: false
    "2.8" {
        description: """The identity provider's issuer and the client id that devices sign in with. Public information."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                issuer { type: string }
                sdk_client_id { type: string }
                public_url { type: string }
                web_url { type: string }
            }
        }
    }
}

exchange {
    authorize: false
    "2.8" {
        description: """Exchange a short assertion signed with the device's key for a short-lived access token."""
        request {
            type: object
            required: ["assertion"]
            properties {
                assertion { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                access_token { type: string }
                expires_in { type: integer }
            }
        }
    }
}

get_all {
    authorize: true
    "2.8" {
        description: """List devices: the caller's own, or all devices for an admin."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                devices { type: array }
            }
        }
    }
}

revoke {
    authorize: true
    "2.8" {
        description: """Revoke a device. Its next request is refused. Allowed for the owner and for an admin."""
        request {
            type: object
            required: ["id"]
            properties {
                id { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
        }
    }
}

reassign {
    authorize: true
    "2.8" {
        description: """Move a device to another admin. The device key stays, so the agent keeps running without re-enrolment. Allowed for an admin only; the new owner must be an enabled admin. Recorded as an audit event."""
        request {
            type: object
            required: ["id", "user"]
            properties {
                id { type: string }
                user { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
        }
    }
}

job_token {
    authorize: true
    "2.8" {
        description: """An agent asks for a token to run one task it has taken. The token acts as the task's owner, for that task only, and ends with the job."""
        request {
            type: object
            required: ["task"]
            properties {
                task { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                access_token { type: string }
                expires_in { type: integer }
            }
        }
    }
}

git_token {
    authorize: true
    "2.8" {
        description: """A read-only credential for one task's repository, for the job or the agent running it. On GitHub it is a token for that repository only, valid for about an hour. On another host it is the Git credential stored for the host and path prefix (username and token), which does not expire; it is refused when none is stored."""
        request {
            type: object
            required: ["task"]
            properties {
                task { type: string }
                repository { type: string, description: "A dataset repository to clone instead of the task's own. Must be allowed in the server's configuration." }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                token { type: string }
                expires_at { type: string, description: "Empty for a stored Git credential, which does not expire" }
                username { type: string }
            }
        }
    }
}
