_description: """Devices (laptops and agents) that sign in through the identity provider and hold a device key."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

enroll {
    authorize: false
    "2.8" {
        description: """Register a device's public key. The request carries the identity provider's sign-in token as a bearer token. Agents may only be enrolled by an admin."""
        request {
            type: object
            required: ["public_key"]
            properties {
                kind { type: string, enum: ["client", "agent"] }
                name { type: string }
                public_key { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                id { type: string }
                kind { type: string }
            }
        }
    }
}

idp_settings {
    authorize: false
    "2.8" {
        description: """The identity provider's issuer and the client id that devices sign in with. Public information."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                issuer { type: string }
                sdk_client_id { type: string }
                public_url { type: string }
                web_url { type: string }
            }
        }
    }
}

exchange {
    authorize: false
    "2.8" {
        description: """Exchange a short assertion signed with the device's key for a short-lived access token."""
        request {
            type: object
            required: ["assertion"]
            properties {
                assertion { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                access_token { type: string }
                expires_in { type: integer }
            }
        }
    }
}

get_all {
    authorize: true
    "2.8" {
        description: """List devices: the caller's own, or all devices for an admin."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                devices { type: array }
            }
        }
    }
}

revoke {
    authorize: true
    "2.8" {
        description: """Revoke a device. Its next request is refused. Allowed for the owner and for an admin."""
        request {
            type: object
            required: ["id"]
            properties {
                id { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
        }
    }
}

job_token {
    authorize: true
    "2.8" {
        description: """An agent asks for a token to run one task it has taken. The token acts as the task's owner, for that task only, and ends with the job."""
        request {
            type: object
            required: ["task"]
            properties {
                task { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                access_token { type: string }
                expires_in { type: integer }
            }
        }
    }
}

git_token {
    authorize: true
    "2.8" {
        description: """A read-only token for one task's GitHub repository, for the job or the agent running it. The token is valid for about an hour and can read only that repository."""
        request {
            type: object
            required: ["task"]
            properties {
                task { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                token { type: string }
                expires_at { type: string }
                username { type: string }
            }
        }
    }
}
