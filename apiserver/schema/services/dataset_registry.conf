_description: """The dataset registry: a repository with one file per dataset. A dataset of our own is added once, by the server, after it has verified the dataset's footprint."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

register {
    "2.8" {
        description: """Add a dataset repository to the registry through a pull request, once. The server reads the repository's default branch with the GitHub App and verifies its footprint (dataset.lock.json against data.dvc); a repository whose footprint does not hold, or that is registered already, is refused."""
        request {
            type: object
            required: ["repository"]
            properties {
                repository { type: string }
                name { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                name { type: string }
                repository { type: string }
                pull_request { type: string }
            }
        }
    }
}

get_all {
    "2.38" {
        description: """The entries of the dataset registry: each dataset's name, how its data is read (source: repo for a dataset of our own, otherwise a public source) and its link. Read-only. The registry is one repository for the server, so the list does not depend on the company."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                datasets {
                    type: array
                    items {
                        type: object
                        properties {
                            name { type: string }
                            source { type: string }
                            link { type: string }
                        }
                    }
                }
            }
        }
    }
}
