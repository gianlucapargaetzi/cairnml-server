_description: """The public dataset registries: a repository with one file per public dataset or adapter. A dataset of our own is not registered: it lives in its own repository and is listed by datasets.visible."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

get_all {
    "2.38" {
        description: """The public entries of the dataset registries of the server: each dataset's name, how its data is read (source: a public source, never repo), its link and the registry that lists it. Read-only. An entry with source repo is not listed. The list does not depend on the company."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                datasets {
                    type: array
                    items {
                        type: object
                        properties {
                            name { type: string }
                            source { type: string }
                            link { type: string }
                            registry { type: string }
                        }
                    }
                }
            }
        }
    }
}

get_registries {
    "2.38" {
        description: """The dataset registries the server reads, in the order they were added. Read-only for everyone; any user may add one (dataset_registry.add), and its owner removes it with datasets.delete."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                registries {
                    type: array
                    items {
                        type: object
                        properties {
                            id { type: string }
                            repository { type: string }
                            url { type: string }
                            added {
                                type: string
                                format: "date-time"
                            }
                            added_by { type: string }
                        }
                    }
                }
            }
        }
    }
}

add {
    "2.38" {
        description: """Add a public dataset registry: a GitHub repository, as owner/name or its github.com address. Any user may add one; the user owns it and it is public to the company, and its entries are added with it. Adding a registry that is already listed changes nothing (updated is 0)."""
        request {
            type: object
            required: [repository]
            properties {
                repository {
                    description: "The GitHub repository: https://github.com/owner/name.git, git@github.com:owner/name.git, or owner/name. Other hosts are not supported."
                    type: string
                }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                updated {
                    description: "1 when the registry was added, 0 when it was already listed"
                    type: integer
                    enum: [ 0, 1 ]
                }
            }
        }
    }
}
