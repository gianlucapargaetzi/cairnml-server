_description: """The public dataset registries: a repository with one file per public dataset or adapter. A dataset of our own is not registered: it lives in its own repository and is listed by datasets.visible."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

get_all {
    "2.38" {
        description: """The public entries of the dataset registries of the server: each dataset's name, how its data is read (source: a public source, never repo), its link and the registry that lists it. Read-only. An entry with source repo is not listed. The list does not depend on the company."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                datasets {
                    type: array
                    items {
                        type: object
                        properties {
                            name { type: string }
                            source { type: string }
                            link { type: string }
                            registry { type: string }
                        }
                    }
                }
            }
        }
    }
}

get_registries {
    "2.38" {
        description: """The dataset registries the server reads, in the order they were added. Read-only for everyone, and read from the database only; any user may add one (dataset_registry.add), its owner or an admin re-reads it with dataset_registry.refresh, and its owner removes it with datasets.delete."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                registries {
                    type: array
                    items {
                        type: object
                        properties {
                            id { type: string }
                            repository { type: string }
                            url { type: string }
                            added {
                                type: string
                                format: "date-time"
                            }
                            added_by { type: string }
                        }
                    }
                }
            }
        }
    }
}

add {
    "2.38" {
        description: """Add a dataset registry: a GitHub repository, as owner/name or its github.com address. Any user may add one; the user owns it, and its entries are added with it. The visibility is user (the default: the owner only), projects or Public, as for a dataset. Adding a registry that is already listed changes nothing (updated is 0)."""
        request {
            type: object
            required: [repository]
            properties {
                repository {
                    description: "The GitHub repository: https://github.com/owner/name.git, git@github.com:owner/name.git, or owner/name. Other hosts are not supported."
                    type: string
                }
                visibility {
                    description: "user (the default), projects or Public"
                    type: string
                    enum: ["user", "projects", "Public"]
                }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                updated {
                    description: "1 when the registry was added, 0 when it was already listed"
                    type: integer
                    enum: [ 0, 1 ]
                }
            }
        }
    }
}

refresh {
    "2.40" {
        description: """Read a dataset registry again from GitHub: its entries are added when new, updated when their data changed, and removed when the registry no longer lists them. Only the owner of the registry and an admin may. A registry is read from GitHub when it is added and when it is refreshed; the page loads read the stored entries. A GitHub error refuses the refresh with its reason, and the stored entries stay as they were."""
        request {
            type: object
            required: [id]
            properties {
                id {
                    description: "The id of the registry (its dataset id, from dataset_registry.get_registries)"
                    type: string
                }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                added {
                    description: "The entries that the registry lists now and the server did not store"
                    type: integer
                }
                updated {
                    description: "The stored entries whose data changed"
                    type: integer
                }
                removed {
                    description: "The stored entries the registry no longer lists"
                    type: integer
                }
            }
        }
    }
}
