_description: """The public dataset registries: a repository with one file per public dataset or adapter. A dataset of our own is not registered: it lives in its own repository and is listed by datasets.list."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

get_all {
    "2.38" {
        description: """The public entries of the dataset registries of the server: each dataset's name, how its data is read (source: a public source, never repo), its link and the registry that lists it. Read-only. An entry with source repo is not listed. A registry that cannot be read is left out. The list does not depend on the company."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                datasets {
                    type: array
                    items {
                        type: object
                        properties {
                            name { type: string }
                            source { type: string }
                            link { type: string }
                            registry { type: string }
                        }
                    }
                }
            }
        }
    }
}
