_description: """Who may use, change and share a queue, a dataset, a registry or a credential: the shares of a resource, and the calls that add and remove them. The shares are kept beside the old grant fields and are not yet used for decisions."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root"]
}

list {
    "2.40" {
        description: """The shares of one resource. Only a user who may manage the sharing of the resource (its owner, or an admin) sees them. A user who may not see the resource gets not found."""
        request {
            type: object
            required: [resource_type, resource_id]
            properties {
                resource_type { type: string, enum: [queue, dataset, registry, credential] }
                resource_id { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                shares { type: array, items { type: object } }
            }
        }
    }
}

share {
    "2.40" {
        description: """Grant a resource at a level to a project (projects scope, the project is a root project), to everyone (public, read only), or to one user (user scope, queues only, read only). The caller must be able to manage the sharing of the resource. A share that already exists is refused."""
        request {
            type: object
            required: [resource_type, resource_id, scope, level]
            properties {
                resource_type { type: string, enum: [queue, dataset, registry, credential] }
                resource_id { type: string }
                scope { type: string, enum: [projects, public, user] }
                project { type: string }
                user { type: string }
                level { type: string, enum: [read, read_write, collaborator] }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                share { type: object }
            }
        }
    }
}

unshare {
    "2.40" {
        description: """Remove one share. The caller must be able to manage the sharing of the resource it gives."""
        request {
            type: object
            required: [share_id]
            properties {
                share_id { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                deleted { type: boolean }
            }
        }
    }
}

notices {
    "2.40" {
        description: """The notices of inherited datasets for the signed-in user: the datasets a run they ran shared with a project they still use, and that they have not dismissed."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                notices { type: array, items { type: object } }
            }
        }
    }
}

dismiss_notice {
    "2.40" {
        description: """Dismiss the notice of an inherited dataset for the signed-in user. A notice the user may not see is not found."""
        request {
            type: object
            required: [id]
            properties {
                id { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
        }
    }
}
