_description: """Repositories: code, datasets and registries of datasets are one kind of record with one credential mechanism. A credential belongs to a user, never to a project: an assignment says how one user reads one repository. A project lists the repositories its runs use."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

get_all {
    "2.40" {
        description: """The repositories the caller sees: those they own, the shared ones and those listed in a project they are in (all, for the admin). Each row says what it is, who owns it, where it is listed, the assignments on it (the caller's own are editable, the others' read-only, never a secret) and how the caller reads it now. With project, only those listed in that project."""
        request {
            type: object
            properties {
                project { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repositories { type: array, items { type: object } }
            }
        }
    }
}

add {
    "2.40" {
        description: """List a repository before any run has used it. role is code, dataset or registry. A user's entry is non-shared; only the admin may add a shared one (shared: true). With project, it is listed in that project; with credential or none_needed, the caller's assignment is set. Any spelling of the address names the same repository."""
        request {
            type: object
            required: [url, role]
            properties {
                url { type: string }
                role { type: string }
                shared { type: boolean }
                project { type: string }
                credential { type: string }
                none_needed { type: boolean }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repository { type: object }
            }
        }
    }
}

delete {
    "2.40" {
        description: """Remove a repository: its record, its entries, its assignments and its links. Only its owner or the admin may. The repository itself is not touched."""
        request {
            type: object
            properties {
                id { type: string }
                repository { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                deleted { type: boolean }
            }
        }
    }
}

set_shared {
    "2.40" {
        description: """Make an entry shared (owned by the admin and visible to every user) or non-shared again. The owner or the admin makes it shared: ownership moves to the admin and the previous owner's assignment and any assignment of a credential that is not the company's are dropped. Only the admin makes it non-shared again. To share, the company credential that reads it (credential), or none_needed for a public repository, is required: it is verified first and becomes the admin's assignment."""
        request {
            type: object
            properties {
                id { type: string }
                repository { type: string }
                shared { type: boolean }
                credential { type: string }
                none_needed { type: boolean }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repository { type: object }
            }
        }
    }
}

check_sharing {
    "2.40" {
        description: """Whether a company credential (credential), or None needed (none_needed) for a public repository, reads the repository, so that it may be shared. Returns ok and, when it does not, the reason."""
        request {
            type: object
            properties {
                id { type: string }
                repository { type: string }
                credential { type: string }
                none_needed { type: boolean }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                ok { type: boolean }
                message { type: string }
            }
        }
    }
}

link {
    "2.40" {
        description: """List a repository in a project by hand. The caller must see the repository and be a member of the project."""
        request {
            type: object
            required: [project]
            properties {
                id { type: string }
                repository { type: string }
                project { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repository { type: object }
            }
        }
    }
}

unlink {
    "2.40" {
        description: """Take a repository out of a project's list. The project's owner and collaborators may, and so may the repository's owner. The repository and every assignment stay."""
        request {
            type: object
            required: [project]
            properties {
                id { type: string }
                repository { type: string }
                project { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repository { type: object }
            }
        }
    }
}

assign {
    "2.40" {
        description: """Set the caller's own assignment on a repository, named by id or address: one of their credentials, or the company's, or none_needed (the host clones it without a credential). With neither, it is cleared. A shared repository is read with a company credential only. The credential must read the repository. Nobody else's assignment is changed. An address no one has listed is listed first as the caller's own non-shared entry, with role (dataset by default)."""
        request {
            type: object
            properties {
                id { type: string }
                repository { type: string }
                role { type: string }
                credential { type: string }
                none_needed { type: boolean }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repository { type: object }
            }
        }
    }
}

unassign {
    "2.40" {
        description: """Clear the caller's own assignment on a repository."""
        request {
            type: object
            properties {
                id { type: string }
                repository { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repository { type: object }
            }
        }
    }
}

check {
    "2.40" {
        description: """Look at a repository again: ask the host whether it is cloned without a credential and try the caller's own assignment. The result is stored on the record and returned."""
        request {
            type: object
            properties {
                id { type: string }
                repository { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repository { type: object }
            }
        }
    }
}

refresh {
    "2.40" {
        description: """Read a registry again and bring its stored entries in line with it. Only its owner and the admin may. Returns the counts added, updated and removed."""
        request {
            type: object
            properties {
                id { type: string }
                repository { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                counts { type: object }
            }
        }
    }
}

get_details {
    "2.40" {
        description: """The details of one dataset: its metadata, its description and its commit history (a dataset of our own, by repository id, address or reference, and optionally a commit), or the stored entry of a registry (entry: its id or reference). Refused as missing when the caller does not see it."""
        request {
            type: object
            properties {
                repository { type: string }
                entry { type: string }
                commit { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
        }
    }
}

get_runs {
    "2.40" {
        description: """The runs that used a repository (as its code, as a dataset or as a registry), newest first, from the projects the caller sees that list it (all, for the admin). Refused as missing when the caller does not see the repository."""
        request {
            type: object
            properties {
                id { type: string }
                repository { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                runs {
                    type: array
                    items { type: object }
                }
            }
        }
    }
}

get_history {
    "2.40" {
        description: """The condensed history of a repository the caller sees: the newest commit, every commit a task ran on (with its tasks, marked when they ran with uncommitted changes), the first commit, and a gap with the number of hidden commits between them. Covers the default branch and every branch that has a task on a commit of its own, as lanes. Shows the latest 30 commits or 30 tasks of the whole graph, whichever limit comes first. Newest first."""
        request {
            type: object
            properties {
                id { type: string }
                repository { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                nodes {
                    type: array
                    items { type: object }
                }
                lane_count { type: integer }
                total_commits { type: integer }
                outside_runs { type: integer }
                limited { type: boolean }
            }
        }
    }
}

find {
    "2.40" {
        description: """The repository a reference names: its id, its name, or the address of its repository. One the caller may not see is refused as missing. A job may call this for its own task only."""
        request {
            type: object
            required: [ref]
            properties {
                ref { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repository { type: object }
            }
        }
    }
}

clone {
    "2.40" {
        description: """What a client needs to clone a dataset repository: its address, the commit (the head when none is named) and a token made with the credential that reads it for the caller (null when it is cloned without one)."""
        request {
            type: object
            required: [ref]
            properties {
                ref { type: string }
                commit { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repository { type: object }
                dataset { type: object }
                commit { type: [string, null] }
                token { type: [string, null] }
                expires_at { type: [string, null] }
                username { type: [string, null] }
            }
        }
    }
}

git_token {
    "2.40" {
        description: """A token for one repository, for a person's machine: read for anyone who sees it, read_write for its owner and the admin. Null when the repository is cloned without one. Refused for jobs and agents. The token is never logged."""
        request {
            type: object
            required: [repository, level]
            properties {
                repository { type: string }
                level { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                token { type: [string, null] }
                expires_at { type: [string, null] }
                username { type: [string, null] }
            }
        }
    }
}

resolve {
    "2.40" {
        description: """How the caller reads each of up to 50 repositories in a project: the badges of the web app."""
        request {
            type: object
            required: [repositories]
            properties {
                repositories { type: array, items { type: string } }
                project { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repositories { type: array, items { type: object } }
            }
        }
    }
}

requirement {
    "2.40" {
        description: """What the repositories of up to 500 tasks need before the caller dispatches them: one row for each repository and project with the ids of its tasks, whether it needs a decision, and the credentials the caller may choose from."""
        request {
            type: object
            required: [tasks]
            properties {
                tasks { type: array, items { type: string } }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repositories { type: array, items { type: object } }
            }
        }
    }
}
