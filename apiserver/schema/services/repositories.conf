_description: """The code repositories runs use. One row per repository; a binding per root project that uses it, owned by the project's owner. A binding is read with the credential assigned to it, with "None needed", or, with nothing assigned, without a credential if the host allows it, else through the company's access."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

get_all {
    "2.40" {
        description: """The repositories of the projects the caller owns or is a member of, or all of the company's for an admin. Each row has its bindings: the project, its owner, who first used it, how it is read (state and message), whether the caller may assign its credential, and the credentials they may choose from (ids and names, never a secret). With project, only the bindings of that project's root project."""
        request {
            type: object
            properties {
                project { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repositories { type: array, items { type: object } }
            }
        }
    }
}

add {
    "2.40" {
        description: """List a repository before any run has used it: its record and the binding of the given project (the caller's own scope without one). The caller must be a member of the project. Any spelling of the address names the same repository."""
        request {
            type: object
            required: [repository]
            properties {
                repository { type: string }
                project { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                binding { type: string }
            }
        }
    }
}

set_credential {
    "2.40" {
        description: """Assign a credential to a binding, assign "None needed", or clear the assignment (no credential and none_needed false). The project's owner may choose any credential of their own or the company's; the user who first used the repository there, only credentials the owner shared with the project; an admin, only company credentials. The credential must be valid for the host and read the repository. None needed is accepted only when the host clones the repository without a credential."""
        request {
            type: object
            required: [binding]
            properties {
                binding { type: string }
                credential { type: string }
                none_needed { type: boolean }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                binding { type: string }
            }
        }
    }
}

check {
    "2.40" {
        description: """Look at a repository binding again: ask the host whether the repository is cloned without a credential (the kept answer is renewed) and, when a credential is assigned, whether it still reads the repository. Returns the binding as the list shows it, with what was found. Anyone who sees the binding in the list may ask."""
        request {
            type: object
            required: [binding]
            properties {
                binding { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                binding { type: object }
            }
        }
    }
}

delete {
    "2.40" {
        description: """Take a repository out of a project's list: its binding, and the repository itself once no project uses it. A run that names the repository again lists it again. Only the owner of the project (or of the run, outside a project) and an admin may."""
        request {
            type: object
            required: [binding]
            properties {
                binding { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                deleted { type: boolean }
            }
        }
    }
}
