_description: """The code repositories runs use. A repository is recorded when a run first uses it, owned by that run's user. A public repository needs no credential; a private one is read through the GitHub App attached to it."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

get_all {
    "2.40" {
        description: """The repositories the signed-in user owns, or all of the company's for an admin: each with its owner, the GitHub App attached to it (an id, never a secret) and when it was last used."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repositories { type: array, items { type: object } }
            }
        }
    }
}

add {
    "2.40" {
        description: """List a repository before any run has used it, owned by the caller. credential is the id of the GitHub App it is read with (the user's own, or the company's; it must be able to read the repository). A public repository needs none. A repository the caller already owns is given the credential; one owned by someone else is refused."""
        request {
            type: object
            required: [repository]
            properties {
                repository { type: string }
                credential { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repository { type: object }
            }
        }
    }
}

set_credential {
    "2.40" {
        description: """Attach a GitHub App to a repository, or detach it with an empty credential. The owner of the repository or an admin may do it. The App must be the user's own or the company's, and must be able to read the repository. A public repository needs none; one attached only lifts the rate limit."""
        request {
            type: object
            required: [repository]
            properties {
                repository { type: string }
                credential { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repository { type: object }
            }
        }
    }
}
