_description: """How the repositories of tasks and datasets are reached: publicly, through a GitHub App, or through a stored token. Read-only; no secret is ever returned."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

resolve {
    "2.38" {
        description: """For each repository (as the task or dataset gives it, a URL or owner/name), how the given project reads it: state (assigned, none_needed, anonymous, company, unknown or unreachable), via (the credential's name), a message for the badge, the binding, whether the caller may assign its credential, and ask (the web app warns before a dispatch). The repository is recorded for the project. An unreachable repository is reported, not raised."""
        request {
            type: object
            required: [repositories]
            properties {
                repositories {
                    type: array
                    maxItems: 50
                    items { type: string }
                }
                project {
                    description: "The project the repositories are used in: the accesses shared with it count too. Optional."
                    type: string
                }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repositories {
                    type: array
                    items {
                        type: object
                        properties {
                            repository { type: string }
                            state { type: string }
                            via { type: string }
                            message { type: string }
                            binding { type: string }
                            can_assign { type: boolean }
                            ask { type: boolean }
                        }
                    }
                }
            }
        }
    }
}

requirement {
    "2.40" {
        description: """What the repositories of the given tasks need before they are dispatched, the code's and the datasets the tasks used: one row per distinct repository and project, with the same fields as resolve, the ids of the tasks and their kinds (code, dataset). A row with ask true is one the web app warns about (nothing assigned, and the company's access does not reach it)."""
        request {
            type: object
            required: [tasks]
            properties {
                tasks {
                    type: array
                    maxItems: 500
                    items { type: string }
                }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repositories { type: array, items { type: object } }
            }
        }
    }
}
