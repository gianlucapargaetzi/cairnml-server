_description: """How the repositories of tasks and datasets are reached: publicly, through a GitHub App, or through a stored token. Read-only; no secret is ever returned."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

resolve {
    "2.38" {
        description: """For each repository (as the task or dataset gives it, a URL or owner/name), how it is reached for the caller: state (public, app, token or refused), via (the App's or token's name) and a message for the badge. The caller's own accesses and those shared with the given project are used. A refused repository is reported, not raised."""
        request {
            type: object
            required: [repositories]
            properties {
                repositories {
                    type: array
                    maxItems: 50
                    items { type: string }
                }
                project {
                    description: "The project the repositories are used in: the accesses shared with it count too. Optional."
                    type: string
                }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repositories {
                    type: array
                    items {
                        type: object
                        properties {
                            repository { type: string }
                            state { type: string }
                            via { type: string }
                            message { type: string }
                        }
                    }
                }
            }
        }
    }
}
