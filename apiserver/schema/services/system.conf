_description: """Maintenance of the end-to-end test stack. Available only where apiserver.e2e.reset_enabled is set (off by
default); admins only."""

_default {
    internal: false
    allow_roles: ["admin", "root", "system"]
    authorize: true
}

e2e_reset {
    "2.1" {
        description: """Remove the objects the end-to-end suite made: projects, tasks and scheduler workers whose name starts
        with the configured prefix (apiserver.e2e.name_prefix), with their contents, and the scheduler's events. Nothing else is
        removed. Refused unless apiserver.e2e.reset_enabled is set."""
        request {
            type: object
            properties {
                prefix {
                    description: "The prefix to reset. Must be the configured one."
                    type: string
                }
            }
        }
        response {
            type: object
            properties {
                projects { type: integer }
                tasks { type: integer }
                workers { type: integer }
                reservations { type: integer }
                scheduler_events { type: integer }
            }
        }
    }
}

e2e_deletions {
    "2.1" {
        description: """The delete service's records for the given urls: the deletions it has not finished, with their status
        and last failure. A url that is not listed has been removed from storage. Refused unless apiserver.e2e.reset_enabled is set."""
        request {
            type: object
            properties {
                urls {
                    description: "The urls to look up"
                    type: array
                    items { type: string }
                }
            }
        }
        response {
            type: object
            properties {
                pending {
                    type: array
                    items { type: object }
                }
            }
        }
    }
}
