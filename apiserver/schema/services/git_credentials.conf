_description: """Git credentials for hosts other than GitHub. Write-only: a secret can be set and deleted, and never read back."""

_default {
    internal: false
    allow_roles: ["admin", "root", "system"]
}

set {
    "2.8" {
        description: """Store the Git credential for a host, or for a path prefix on it (replacing the one stored before). The secret is encrypted at rest and is never returned by any call. For a repository, the entry with the longest matching path prefix is used."""
        request {
            type: object
            required: ["host", "username", "secret"]
            properties {
                host { type: string }
                path { type: string }
                username { type: string }
                secret { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                credential {
                    type: object
                    properties {
                        host { type: string }
                        path { type: string }
                        username { type: string }
                        updated { type: string }
                    }
                }
            }
        }
    }
}

delete {
    "2.8" {
        description: """Delete the Git credential stored for a host and path prefix."""
        request {
            type: object
            required: ["host"]
            properties {
                host { type: string }
                path { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                deleted { type: integer }
            }
        }
    }
}

get_all {
    "2.8" {
        description: """The Git credentials configured on this server, without their secrets: which hosts and path prefixes have one, and the user name used with it."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                credentials {
                    type: array
                    items {
                        type: object
                        properties {
                            host { type: string }
                            path { type: string }
                            username { type: string }
                            updated { type: string }
                        }
                    }
                }
            }
        }
    }
}
