_description: """The Datasets page: the datasets the server can read, and what one dataset is made of (its metadata, its description and its commit history). Read-only, through the GitHub App."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

get_details {
    "2.40" {
        description: """The details of one dataset. A dataset of our own is named by its github.com repository (and optionally a commit); a dataset of the registry by its name. metadata is null when the dataset has no manifest.json; description is the text of DATASET.md, or null."""
        request {
            type: object
            properties {
                repository { type: string }
                registry_name { type: string }
                commit { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                kind { type: string }
                name { type: string }
                repository { type: string }
                registry { type: string }
                link { type: string }
                source { type: string }
                revision { type: string }
                branch { type: string }
                metadata { type: object }
                description { type: string }
                commits {
                    type: array
                    items {
                        type: object
                        properties {
                            sha { type: string }
                            message { type: string }
                            author { type: string }
                            date { type: string }
                            parents { type: array, items { type: string } }
                        }
                    }
                }
            }
        }
    }
}

visible {
    "2.40" {
        description: """The datasets the signed-in user may see: the datasets they added, those shared with a project they belong to, and the public ones. Each has its kind (repo, registry or registry_entry), its owner, its visibility (user, projects or Public), the projects it is shared with, the credential that reads it (an access id, never a secret), and its state: ok, or no_access with a message naming the dataset."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                datasets { type: array, items { type: object } }
            }
        }
    }
}

add {
    "2.40" {
        description: """Add a dataset to the environment, without creating anything. kind is repo (a GitHub repository) or registry (a registry repository, whose entries are added too). credential is the id of the access the dataset is read with: one of the user's own, or the company's. A dataset with no credential is public; a private one with none is added with no access, and its message names what to add. A credential that cannot read the repository is refused. visibility is user, projects or Public. A repository already added is refused."""
        request {
            type: object
            required: [url]
            properties {
                kind { type: string, enum: ["repo", "registry"] }
                url { type: string }
                visibility { type: string, enum: ["user", "projects", "Public"] }
                project { type: string }
                credential { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                dataset { type: object }
            }
        }
    }
}

clone {
    "2.40" {
        description: """What a client needs to clone a repository dataset: its address, the commit (the head when none is named), and a read token made with the dataset's credential (null for a public repository). A dataset the caller may not see is refused as missing. A job names its own task and may clone what its task's user may see."""
        request {
            type: object
            required: [ref]
            properties {
                ref { type: string }
                commit { type: string }
                task { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                repository { type: string }
                dataset { type: object }
                commit { type: string }
                token { type: string }
                expires_at { type: string }
                username { type: string }
            }
        }
    }
}

resolve {
    "2.40" {
        description: """The dataset a reference names: its id, its name (unique in the company), or the address of its repository. A dataset the caller may not see is refused as missing. A job names its own task in task, and may resolve only the datasets its task's user may see or its project holds."""
        request {
            type: object
            required: [ref]
            properties {
                ref { type: string }
                task { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                dataset { type: object }
            }
        }
    }
}

set_credential {
    "2.40" {
        description: """Set the credential a repository dataset is read with, or clear it (an empty credential makes the dataset public). The credential is an access id of the user's own, or the company's. Only the owner of the dataset or an admin may change it. The credential must be able to read the repository."""
        request {
            type: object
            required: [repository]
            properties {
                repository { type: string }
                credential { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                dataset { type: object }
            }
        }
    }
}

set_visibility {
    "2.40" {
        description: """Change who may see a dataset: user (the owner only), projects (the owner and members of the given projects) or Public (every user). Only the owner or an admin may change it. projects are kept only for projects."""
        request {
            type: object
            required: [id, visibility]
            properties {
                id { type: string }
                visibility { type: string, enum: ["user", "projects", "Public"] }
                projects { type: array, items { type: string } }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                dataset { type: object }
            }
        }
    }
}

allocate {
    "2.40" {
        description: """Share a dataset with a project. The user must be a member of the project and must see the dataset. A dataset kept for its owner only is shared by its owner, and becomes shared with projects. The project then uses the dataset's credential."""
        request {
            type: object
            required: [id, project]
            properties {
                id { type: string }
                project { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                dataset { type: object }
            }
        }
    }
}

unallocate {
    "2.40" {
        description: """Stop sharing a dataset with a project. The user must be a member of the project and must see the dataset."""
        request {
            type: object
            required: [id, project]
            properties {
                id { type: string }
                project { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                dataset { type: object }
            }
        }
    }
}

check {
    "2.40" {
        description: """Look at a repository dataset again: whether its repository can be read with the credential it has, or without one when it has none. The answer (ok, or no_access with the reason) and the time are stored on the dataset and returned. Anyone who may see the dataset may ask. Refused as not found otherwise, and for a registry (it is read again with its refresh)."""
        request {
            type: object
            required: [id]
            properties {
                id { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                dataset { type: object }
            }
        }
    }
}

delete {
    "2.40" {
        description: """Remove a dataset from the environment. Only the record: the repository is not touched. Only the owner or an admin may remove it."""
        request {
            type: object
            required: [id]
            properties {
                id { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                deleted { type: boolean }
            }
        }
    }
}

git_token {
    "2.40" {
        description: """A token for one dataset repository, for a person's machine, at the level the person holds on the dataset (through its shares). The token is made with the credential the dataset was added with: a GitHub App (read gives a read-only token, read_write a token that may write to that repository only, when the App is installed with write access to its contents). The credential must be the person's own or the company's. A public dataset needs no token for read: token is null. A private dataset with no credential is refused. Refused as not found when the person holds no level on the dataset. Refused for jobs and agents. The token is never logged."""
        request {
            type: object
            required: [repository, level]
            properties {
                repository { type: string }
                level { type: string, enum: ["read", "read_write"] }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                token { type: ["string", "null"] }
                expires_at { type: ["string", "null"] }
                username { type: ["string", "null"] }
            }
        }
    }
}
