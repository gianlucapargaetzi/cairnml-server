_description: """The Datasets page: the datasets the server can read, and what one dataset is made of (its metadata, its description and its commit history). Read-only, through the GitHub App."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

list {
    "2.40" {
        description: """The datasets: the repositories the GitHub App is installed on whose default branch has a dataset.yaml at its root, and whose footprint holds. A repository without dataset.yaml is not listed. Each dataset has its repository (owner/name), its default branch, the head commit, a footprint summary from dataset.lock.json (format kind, samples and labels) and the text of DATASET.md when the repository has one (cut to 20 KB; description_truncated says so). The description is text written by the dataset's authors: show it as text, never as markup or code. Read-only. The list is a cache: it is read without a GitHub call and rebuilt once an hour, and a job token refreshes the entry of its repository (see the Datasets section of the server README). refreshed_at is when the whole list was last rebuilt, and each dataset's checked_at when it was last checked; a dataset whose check failed keeps its last entry. The list does not depend on the company."""
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            properties {
                datasets {
                    type: array
                    items {
                        type: object
                        properties {
                            repository { type: string }
                            default_branch { type: string }
                            head_commit { type: string }
                            footprint {
                                type: object
                                properties {
                                    format { type: string }
                                    samples { type: integer }
                                    labels { type: object }
                                }
                            }
                            description { type: string }
                            description_truncated { type: boolean }
                            checked_at { type: string }
                        }
                    }
                }
                refreshed_at { type: string }
            }
        }
    }
}

get_details {
    "2.40" {
        description: """The details of one dataset. A dataset of our own is named by its github.com repository (and optionally a commit); a dataset of the registry by its name. metadata is null when the dataset has no manifest.json; description is the text of DATASET.md, or null."""
        request {
            type: object
            properties {
                repository { type: string }
                registry_name { type: string }
                commit { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                kind { type: string }
                name { type: string }
                repository { type: string }
                registry { type: string }
                link { type: string }
                source { type: string }
                revision { type: string }
                branch { type: string }
                metadata { type: object }
                description { type: string }
                commits {
                    type: array
                    items {
                        type: object
                        properties {
                            sha { type: string }
                            message { type: string }
                            author { type: string }
                            date { type: string }
                            parents { type: array, items { type: string } }
                        }
                    }
                }
            }
        }
    }
}
