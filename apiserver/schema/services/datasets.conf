_description: """The Datasets page: what one dataset is made of (its metadata, its description and its commit history). Read-only, through the GitHub App."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

get_details {
    "2.40" {
        description: """The details of one dataset. A dataset of our own is named by its github.com repository (and optionally a commit); a dataset of the registry by its name. metadata is null when the dataset has no manifest.json; description is the text of DATASET.md, or null."""
        request {
            type: object
            properties {
                repository { type: string }
                registry_name { type: string }
                commit { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                kind { type: string }
                name { type: string }
                repository { type: string }
                registry { type: string }
                link { type: string }
                source { type: string }
                revision { type: string }
                branch { type: string }
                metadata { type: object }
                description { type: string }
                commits {
                    type: array
                    items {
                        type: object
                        properties {
                            sha { type: string }
                            message { type: string }
                            author { type: string }
                            date { type: string }
                            parents { type: array, items { type: string } }
                        }
                    }
                }
            }
        }
    }
}
