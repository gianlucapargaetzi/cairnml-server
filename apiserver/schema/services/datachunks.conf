_description: """Object storage for artifacts, datasets, models and debug data. The client asks for a presigned URL with its task token, uploads the bytes straight to the store, then commits. Downloads use presigned URLs too."""

_default {
    internal: false
    allow_roles: ["user", "admin", "root", "system"]
}

prepare_upload {
    "2.8" {
        description: """Record a pending upload and return a presigned PUT URL for its bytes. The caller must have write access to the task, or hold a job token for it. The headers returned must be sent with the PUT. Size and sha256 are bound to the URL."""
        request {
            type: object
            required: ["task", "kind", "name", "size", "sha256"]
            properties {
                task { type: string }
                kind { type: string, enum: ["artifact", "dataset", "model", "debug"] }
                name { type: string }
                size { type: integer, minimum: 0 }
                sha256 { type: string, pattern: "^[0-9a-f]{64}$" }
                content_type { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                id { type: string }
                method { type: string }
                url { type: string }
                headers { type: object }
                expires_at { type: string }
            }
        }
    }
}

commit {
    "2.8" {
        description: """Check the stored object against the record (size and sha256). A mismatch deletes the object. Only the upload's own task may commit a job's upload."""
        request {
            type: object
            required: ["id"]
            properties {
                id { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                id { type: string }
                state { type: string }
            }
        }
    }
}

prepare_download {
    "2.8" {
        description: """Return a presigned GET URL for a stored object, by datachunk id, or by task, kind and name (the newest stored object with that name). Only stored objects can be downloaded."""
        request {
            type: object
            properties {
                id { type: string }
                task { type: string }
                kind { type: string, enum: ["artifact", "dataset", "model", "debug"] }
                name { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                id { type: string }
                url { type: string }
                expires_at { type: string }
            }
        }
    }
}

delete {
    "2.8" {
        description: """Remove stored objects and their records, by datachunk id, or by task, kind and name. Callers need write access to the task (or hold its job token)."""
        request {
            type: object
            properties {
                id { type: string }
                task { type: string }
                kind { type: string, enum: ["artifact", "dataset", "model", "debug"] }
                name { type: string }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                deleted { type: integer }
            }
        }
    }
}
