_description: """Audit events of sign-ins, enrolments, tokens and refusals. Admins only."""

_default {
    internal: false
    allow_roles: ["admin", "root", "system"]
    authorize: true
}

get_all {
    "2.8" {
        description: """List audit events, newest first, with optional filters on actor, action and time. Each event carries the address the client used."""
        request {
            type: object
            properties {
                actor { type: string }
                action { type: string }
                since { type: string, description: "ISO 8601 time" }
                until { type: string, description: "ISO 8601 time" }
                page { type: integer }
                page_size { type: integer, maximum: 500 }
            }
            additionalProperties: false
        }
        response {
            type: object
            properties {
                events { type: array }
                total { type: integer }
                page { type: integer }
                page_size { type: integer }
            }
        }
    }
}
