_description: "A request of several shapes whose item has no name in the generator's mapping."
_definitions {
    widget_a {
        type: object
        required: [ kind ]
        properties {
            kind {
                description: "Kind of the widget"
                type: string
            }
        }
    }
    widget_b {
        type: object
        required: [ size ]
        properties {
            size {
                description: "Size of the widget"
                type: integer
            }
        }
    }
}

add {
    "2.41" {
        description: "Adds a widget"
        request {
            type: object
            anyOf: [
                { "$ref": "#/definitions/widget_a" }
                { "$ref": "#/definitions/widget_b" }
            ]
        }
        response {
            type: object
        }
    }
}
