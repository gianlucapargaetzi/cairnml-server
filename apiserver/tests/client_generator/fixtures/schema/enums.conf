_description: "Enumeration fields: a request field and a list field that refer to a string enumeration."
_definitions {
    mode_enum {
        description: "Modes of the demo"
        type: string
        enum: [ fast, slow ]
    }
}

set_mode {
    "2.41" {
        description: "Sets the mode"
        request {
            type: object
            required: [ mode ]
            properties {
                mode {
                    description: "The mode"
                    "$ref": "#/definitions/mode_enum"
                }
                modes {
                    description: "Several modes"
                    type: array
                    items {
                        "$ref": "#/definitions/mode_enum"
                    }
                }
            }
        }
        response {
            type: object
            properties {
                mode {
                    description: "The mode that was set"
                    "$ref": "#/definitions/mode_enum"
                }
            }
        }
    }
}
