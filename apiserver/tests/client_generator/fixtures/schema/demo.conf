_description: "Demo service for the generator tests."
_definitions {
    entry {
        type: object
        properties {
            task {
                description: "Queued task ID"
                type: string
            }
            added {
                description: "Time this entry was added"
                type: string
                format: "date-time"
            }
        }
    }
    legacy {
        type: object
        properties {
            old {
                description: "Only the oldest get_all knows this"
                type: string
            }
        }
    }
}

get_by_id {
    "2.4" {
        description: "Gets an entry"
        request {
            type: object
            required: [ queue ]
            properties {
                queue {
                    description: "Queue ID"
                    type: string
                }
                max_task_entries {
                    description: "Max number of entries to return"
                    type: integer
                }
            }
        }
        response {
            type: object
            properties {
                entry {
                    description: "Entry info"
                    "$ref": "#/definitions/entry"
                }
            }
        }
    }
}

get_all {
    "2.1" {
        description: "Lists entries (oldest definition)"
        request {
            type: object
            properties {
                name {
                    description: "Name"
                    type: string
                }
            }
        }
        response {
            type: object
            properties {
                legacy {
                    description: "Legacy info"
                    "$ref": "#/definitions/legacy"
                }
            }
        }
    }
    "2.15" {
        description: "Lists entries"
        request {
            type: object
            properties {
                name {
                    description: "Name"
                    type: string
                }
            }
        }
        response {
            type: object
            properties {
                count {
                    description: "Number of entries"
                    type: integer
                }
            }
        }
    }
    "2.30": ${get_all."2.15"} {
        request.properties.page {
            description: "Page number"
            type: integer
        }
        request.properties.tags {
            description: "Tags"
            type: array
            items { type: string }
        }
    }
}
