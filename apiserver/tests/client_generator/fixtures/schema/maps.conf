_description: "Maps of definitions: a map of parameter items, a map of those maps, and maps that stay dictionaries."
_definitions {
    param_item {
        type: object
        properties {
            name {
                description: "Name of the parameter"
                type: string
            }
            value {
                description: "Value of the parameter"
                type: string
            }
        }
    }
    param_section {
        description: "Parameters of one section"
        type: object
        additionalProperties {
            "$ref": "#/definitions/param_item"
        }
    }
    free_form {
        description: "Any object"
        type: object
        additionalProperties = true
    }
    mode_enum {
        description: "Modes of the demo"
        type: string
        enum: [ fast, slow ]
    }
    mode_map {
        description: "Modes by name"
        type: object
        additionalProperties {
            "$ref": "#/definitions/mode_enum"
        }
    }
}

set_params {
    "2.42" {
        description: "Sets parameters"
        request {
            type: object
            required: [ section ]
            properties {
                section {
                    description: "One section"
                    "$ref": "#/definitions/param_section"
                }
                sections {
                    description: "Sections by name"
                    type: object
                    additionalProperties {
                        "$ref": "#/definitions/param_section"
                    }
                }
                labels {
                    description: "Plain labels"
                    type: object
                    additionalProperties {
                        type: string
                    }
                }
                extra {
                    description: "Anything"
                    "$ref": "#/definitions/free_form"
                }
                modes {
                    description: "Modes by name"
                    "$ref": "#/definitions/mode_map"
                }
            }
        }
        response {
            type: object
            properties {
                sections {
                    description: "Sections as stored"
                    type: object
                    additionalProperties {
                        "$ref": "#/definitions/param_section"
                    }
                }
            }
        }
    }
}
