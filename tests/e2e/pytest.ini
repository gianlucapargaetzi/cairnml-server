[pytest]
testpaths = .
addopts = -ra --strict-markers
markers =
    agent: needs the managed agent running on this machine (sections 5 and 6)
    docker: needs the Docker daemon on this machine
    ui: drives the web app in a headless browser
    github: needs the GitHub App (repositories on github.com); skipped locally
    slow: takes more than a minute
    restart: restarts a service of the stack; it runs last (with -n: pytest -m restart, after the rest)
    xdist_group: tests of one group run in one worker (the agent tests share one agent)
