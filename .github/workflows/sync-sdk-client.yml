name: sync-sdk-client

# After every change of the server's main that touches the schema or the generator, regenerates the SDK's generated
# client and opens a PR in the SDK repo. A red SDK check on that PR is the signal that the SDK must be updated.
on:
  push:
    branches: [main]
    paths:
      - "apiserver/schema/services/**"
      - "apiserver/client_generator/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: gianlucapargaetzi
          repositories: cairnml,cairnml-server
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          token: ${{ steps.app.outputs.token }}
          path: sdk
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyhocon jinja2
      - name: Regenerate the client from this schema
        run: python -m apiserver.client_generator generate --target sdk --out sdk/cairnml/backend_api/services
        env:
          PYTHONPATH: .
      - name: Open a PR in the SDK repo when the client changed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          cd sdk
          if git diff --quiet; then echo "The client is up to date"; exit 0; fi
          BRANCH="sync/api-${GITHUB_SHA::8}"
          git config user.email release@example.invalid
          git config user.name release
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Regenerate the API client from cairnml-server ${GITHUB_SHA::8}"
          git push -u origin "$BRANCH"
          gh pr create --repo gianlucapargaetzi/cairnml --base main --head "$BRANCH" \
            --title "Regenerate the API client from cairnml-server ${GITHUB_SHA::8}" \
            --body "The server's schema changed on its main (cairnml-server@${GITHUB_SHA}). This PR is the generated client for it. If the api contract check is red, the hand-written SDK code needs updating too."
