name: release

# Releases the three projects in order: server, SDK (cairnml), agent (cairnml-agent), then the server image.
# Started by hand with the server version.
#
# 1. check: the versions are new, and the three mains work together. Nothing is released if it fails.
# 2. resolve: the commits of the SDK and the agent main are fixed here, once. Everything below uses these commits.
# 3. server: tags and releases the server.
# 4. SDK: releases the commit from step 2 under its version.py version. Its publish workflow waits for the "pypi"
#    approval.
# 5. agent: releases the commit from step 2 under its version.py version, once the SDK is published.
# 6. image: builds the server image with the SDK and the agent built from those same commits (docker.yml, its
#    "dockerhub" approval). No pin file is involved.
#
# Each release is created with the GitHub App (secrets RELEASE_APP_ID, RELEASE_APP_KEY), because a release made with
# the default token does not start the publish workflows. The "release" environment must have required reviewers:
# it stops the run before the server is tagged.
on:
  workflow_dispatch:
    inputs:
      server_version:
        description: Server version to release, without the v (for example 0.0.6)
        required: true

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/release-check.yml
    with:
      server_version: ${{ inputs.server_version }}

  resolve:
    name: fix the SDK and agent commits
    needs: check
    runs-on: ubuntu-latest
    outputs:
      sdk_sha: ${{ steps.commits.outputs.sdk_sha }}
      agent_sha: ${{ steps.commits.outputs.agent_sha }}
      sdk_version: ${{ steps.commits.outputs.sdk_version }}
      agent_version: ${{ steps.commits.outputs.agent_version }}
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: gianlucapargaetzi
          repositories: cairnml,cairnml-agent
      - id: commits
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          for pair in "cairnml:cairnml/version.py:sdk" "cairnml-agent:cairnml_agent/version.py:agent"; do
            REPO="gianlucapargaetzi/${pair%%:*}"
            REST="${pair#*:}"; PATH_IN="${REST%%:*}"; NAME="${REST#*:}"
            SHA="$(gh api "repos/$REPO/commits/main" --jq .sha)"
            VERSION="$(gh api "repos/$REPO/contents/$PATH_IN?ref=$SHA" --jq .content | base64 -d | python3 -c "import re,sys;print(re.search(r'__version__ = .(.+).', sys.stdin.read()).group(1))")"
            echo "${NAME}_sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "${NAME}_version=$VERSION" >> "$GITHUB_OUTPUT"
          done

  server:
    name: release the server
    needs: check
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: gianlucapargaetzi
          repositories: cairnml-server
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag and release the server at the commit of main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          V: ${{ inputs.server_version }}
        run: gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$V" --generate-notes

  sdk:
    name: release the SDK
    needs: [resolve, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: gianlucapargaetzi
          repositories: cairnml
      - name: Release the SDK commit and wait for its PyPI publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          V: ${{ needs.resolve.outputs.sdk_version }}
          SHA: ${{ needs.resolve.outputs.sdk_sha }}
        run: |
          gh release create "v$V" --repo gianlucapargaetzi/cairnml --target "$SHA" --title "v$V" --generate-notes
          sleep 20
          RUN="$(gh run list --repo gianlucapargaetzi/cairnml --workflow publish.yml --event release --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run watch "$RUN" --repo gianlucapargaetzi/cairnml --exit-status

  agent:
    name: release the agent
    needs: [resolve, sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: gianlucapargaetzi
          repositories: cairnml-agent
      - name: Release the agent commit and wait for its PyPI publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          V: ${{ needs.resolve.outputs.agent_version }}
          SHA: ${{ needs.resolve.outputs.agent_sha }}
        run: |
          gh release create "v$V" --repo gianlucapargaetzi/cairnml-agent --target "$SHA" --title "v$V" --generate-notes
          sleep 20
          RUN="$(gh run list --repo gianlucapargaetzi/cairnml-agent --workflow publish.yml --event release --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run watch "$RUN" --repo gianlucapargaetzi/cairnml-agent --exit-status

  image:
    name: build and publish the server image
    needs: [resolve, server, agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: gianlucapargaetzi
          repositories: cairnml-server
      - name: Start docker.yml on the server tag with the release commits, and wait for it
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          V: ${{ inputs.server_version }}
          SDK_SHA: ${{ needs.resolve.outputs.sdk_sha }}
          AGENT_SHA: ${{ needs.resolve.outputs.agent_sha }}
        run: |
          gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "v$V" \
            -f version="$V" -f sdk_sha="$SDK_SHA" -f agent_sha="$AGENT_SHA"
          sleep 20
          RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow docker.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run watch "$RUN" --repo "$GITHUB_REPOSITORY" --exit-status
