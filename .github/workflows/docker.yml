name: docker

# - Pull request: builds the image and scans it. Nothing is pushed.
# - Started by the release workflow (workflow_dispatch) after the server tag exists: builds, scans, and pushes the image
#   to Docker Hub. The job waits for the owner's approval (environment "dockerhub"), which also holds the Docker Hub
#   credentials. The SDK and the agent are built from the exact commits the release tagged (sdk_sha, agent_sha).
# The web app comes from the branch named in docker/build/web-ref ("main": the newest commit of cairnml-web's main).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Server version to publish, without the v
        required: true
      sdk_sha:
        description: The cairnml commit that the SDK release tagged
        required: true
      agent_sha:
        description: The cairnml-agent commit that the agent release tagged
        required: true
      web_sha:
        description: "The cairnml-web commit the release picked (empty: the commit named in web-ref)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ${{ github.repository_owner }}/cairnml-server

jobs:
  docker-build:
    name: docker-build
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: web
        run: echo "ref=$(cat docker/build/web-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-web
          ref: ${{ inputs.web_sha || steps.web.outputs.ref }}
          path: web
      # The image's "What's new" bundle reads the SDK's changelog too: the SDK at its main branch, as fetch-sources.sh does.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          path: sdk
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/build/Dockerfile
          build-contexts: |
            cairnml_web=./web
            cairnml_sdk=./sdk
          build-args: CAIRNML_FROM=pypi
          load: true
          push: false
          tags: cairnml-server:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The scanner runs from its own image on Docker Hub, pinned to a version, instead of downloading the binary from
      # GitHub at each run; that download failed intermittently on the runners.
      - name: Scan the image (report only on pull requests)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 cairnml-server:check

  publish:
    name: publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: web
        run: echo "ref=$(cat docker/build/web-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-web
          ref: ${{ inputs.web_sha || steps.web.outputs.ref }}
          path: web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          ref: ${{ inputs.sdk_sha }}
          path: sdk
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-agent
          ref: ${{ inputs.agent_sha }}
          path: agent
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=SSPL-1.0
            org.opencontainers.image.description=CairnML server: unofficial modified fork of the ClearML server
      - name: Build once to scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/build/Dockerfile
          build-contexts: |
            cairnml_web=./web
            cairnml_sdk=./sdk
            cairnml_agent=./agent
          build-args: |
            CAIRNML_FROM=source
            VERSION=${{ inputs.version }}
            BUILD=${{ github.sha }}
          load: true
          push: false
          tags: cairnml-server:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image (a critical vulnerability with a fix stops the release)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 cairnml-server:scan
      - name: Push with provenance and an SBOM
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/build/Dockerfile
          build-contexts: |
            cairnml_web=./web
            cairnml_sdk=./sdk
            cairnml_agent=./agent
          build-args: |
            CAIRNML_FROM=source
            VERSION=${{ inputs.version }}
            BUILD=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
