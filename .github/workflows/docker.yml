name: docker

# - Pull request: builds the image and scans it. Nothing is pushed.
# - Tag vX.Y.Z: builds, scans, and pushes the image to Docker Hub. The job waits for the owner's approval
#   (environment "dockerhub"), which also holds the Docker Hub credentials.
# The web app comes from the commit named in docker/build/web-ref (update it by pull request, like a pin).
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ${{ github.repository_owner }}/cairnml-server

jobs:
  docker-build:
    name: docker-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: web
        run: echo "ref=$(cat docker/build/web-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-web
          ref: ${{ steps.web.outputs.ref }}
          path: web
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/build/Dockerfile
          build-contexts: cairnml_web=./web
          build-args: CAIRNML_FROM=pypi
          load: true
          push: false
          tags: cairnml-server:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image (report only on pull requests)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cairnml-server:check
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  publish:
    name: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: web
        run: echo "ref=$(cat docker/build/web-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-web
          ref: ${{ steps.web.outputs.ref }}
          path: web
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=SSPL-1.0
            org.opencontainers.image.description=CairnML server: unofficial modified fork of the ClearML server
      - name: Build once to scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/build/Dockerfile
          build-contexts: cairnml_web=./web
          build-args: |
            CAIRNML_FROM=pypi
            VERSION=${{ github.ref_name }}
            BUILD=${{ github.sha }}
          load: true
          push: false
          tags: cairnml-server:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image (a critical vulnerability with a fix stops the release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cairnml-server:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push with provenance and an SBOM
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/build/Dockerfile
          build-contexts: cairnml_web=./web
          build-args: |
            CAIRNML_FROM=pypi
            VERSION=${{ github.ref_name }}
            BUILD=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
