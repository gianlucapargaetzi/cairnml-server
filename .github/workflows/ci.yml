name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.3
        ports:
          - 6379:6379
    env:
      CAIRNML_REDIS_SERVICE_HOST: localhost
      CAIRNML_REDIS_SERVICE_PORT: "6379"
      CAIRNML_ALLOW_CONFIG_SECRET: "1"
      CAIRNML_SECRETS_DIR: /tmp/cairnml-secrets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Python 3.11 is the version of the image, and requirements.lock was made for it.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apiserver/requirements.lock
      - name: A test secret
        run: |
          mkdir -p "$CAIRNML_SECRETS_DIR"
          echo -n test > "$CAIRNML_SECRETS_DIR/s3_secret_key"
      - run: python -m pip install --require-hashes -r apiserver/requirements.lock
      - run: python -m pip install pytest
      # Everything that does not need MongoDB, Elasticsearch or a running API server. The tests that do carry the
      # "integration" marker and run in the end-to-end suite.
      - run: python -m pytest -q -m "not integration" apiserver/tests
