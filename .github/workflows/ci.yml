name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.3
        ports:
          - 6379:6379
      # The project-access unit tests (ProjectAccessBLL and the service-layer enforcement tests) save real
      # documents, so they need a real MongoDB; they are not integration tests (no Elasticsearch, no running API
      # server), so they stay out of the "integration" marker and run here. The default config already points at
      # 127.0.0.1:27017, so no env override is needed.
      mongo:
        image: mongo:8.0.15
        ports:
          - 27017:27017
    env:
      CAIRNML_REDIS_SERVICE_HOST: localhost
      CAIRNML_REDIS_SERVICE_PORT: "6379"
      CAIRNML_ALLOW_CONFIG_SECRET: "1"
      CAIRNML_SECRETS_DIR: /tmp/cairnml-secrets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Python 3.11 is the version of the image, and requirements.lock was made for it.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apiserver/requirements.lock
      - name: A test secret
        run: |
          mkdir -p "$CAIRNML_SECRETS_DIR"
          echo -n test > "$CAIRNML_SECRETS_DIR/s3_secret_key"
      - run: python -m pip install --require-hashes -r apiserver/requirements.lock
      - run: python -m pip install pytest
      # Everything that does not need Elasticsearch or a running API server (MongoDB is available above). The
      # tests that still need those carry the "integration" marker and run in the end-to-end suite.
      - run: python -m pytest -q -m "not integration" apiserver/tests

  # Not a required check, so it does not block a merge. It runs the same unit tests against the SDK and the agent from
  # main of their repositories, so a change there that breaks the server shows up before the next release. The image
  # itself installs the released versions of the lock.
  drift:
    name: drift (SDK and agent from main)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.3
        ports:
          - 6379:6379
      mongo:
        image: mongo:8.0.15
        ports:
          - 27017:27017
    env:
      CAIRNML_REDIS_SERVICE_HOST: localhost
      CAIRNML_REDIS_SERVICE_PORT: "6379"
      CAIRNML_ALLOW_CONFIG_SECRET: "1"
      CAIRNML_SECRETS_DIR: /tmp/cairnml-secrets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: A test secret
        run: |
          mkdir -p "$CAIRNML_SECRETS_DIR"
          echo -n test > "$CAIRNML_SECRETS_DIR/s3_secret_key"
      # The ranges of requirements.txt, then the two packages replaced by main of their repositories.
      - run: python -m pip install -r apiserver/requirements.txt pytest
      - run: |
          python -m pip install --no-deps --force-reinstall \
            "cairnml @ git+https://github.com/gianlucapargaetzi/cairnml.git@main" \
            "cairnml-agent @ git+https://github.com/gianlucapargaetzi/cairnml-agent.git@main"
      - name: Show the commits that were installed
        run: |
          python -c "import importlib.metadata as m; [print(n, m.distribution(n).read_text('direct_url.json')) for n in ('cairnml', 'cairnml-agent')]"
      - run: python -m pytest -q -m "not integration" apiserver/tests
