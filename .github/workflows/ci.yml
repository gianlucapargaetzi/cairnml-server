name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.draft == false
    name: test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.3
        ports:
          - 6379:6379
      # The project-access unit tests (ProjectAccessBLL and the service-layer enforcement tests) save real
      # documents, so they need a real MongoDB; they are not integration tests (no Elasticsearch, no running API
      # server), so they stay out of the "integration" marker and run here. The default config already points at
      # 127.0.0.1:27017, so no env override is needed.
      mongo:
        image: mongo:8.0.15
        ports:
          - 27017:27017
    env:
      CAIRNML_REDIS_SERVICE_HOST: localhost
      CAIRNML_REDIS_SERVICE_PORT: "6379"
      CAIRNML_ALLOW_CONFIG_SECRET: "1"
      CAIRNML_SECRETS_DIR: /tmp/cairnml-secrets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Python 3.11 is the version of the image, and requirements.lock was made for it.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apiserver/requirements.lock
      - name: A test secret
        run: |
          mkdir -p "$CAIRNML_SECRETS_DIR"
          echo -n test > "$CAIRNML_SECRETS_DIR/s3_secret_key"
      - run: python -m pip install --require-hashes -r apiserver/requirements.lock
      - run: python -m pip install pytest
      # Everything that does not need Elasticsearch or a running API server (MongoDB is available above). The
      # tests that still need those carry the "integration" marker and run in the end-to-end suite.
      - run: python -m pytest -q -m "not integration" apiserver/tests

  # API change: compares the schema with the one of the base branch. An addition never fails this job. A removed or changed
  # endpoint fails it unless the API version is raised in this pull request and the changelog names the endpoint under
  # "## API <version>". The check only runs on pull requests, because it compares with the base branch.
  api-change:
    name: api-change
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r apiserver/requirements.lock
      - run: git fetch --no-tags origin "${{ github.base_ref }}"
      - run: python -m apiserver.contract.evolution --base-ref "origin/${{ github.base_ref }}"

  # Lint: only the Python files a pull request adds or changes are checked, so code it does not touch is never reported.
  # A touched file must be clean for these rules: F (pyflakes: unused imports and variables, undefined names), B904
  # (raise ... from inside except), E722 (bare except), B006 (mutable default argument), B023 (closure over a loop
  # variable) and PLE (pylint errors). A file the pull request adds must also pass `ruff format --check`. Nothing that
  # exists is reformatted, and the job does not run on push to main. ruff.toml sets line length 120 and Python 3.11;
  # the rules stay on the command line so they are visible here.
  ruff:
    name: ruff
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r lint-requirements.txt
      - name: Check the changed files
        run: |
          BASE="origin/${{ github.base_ref }}"
          git diff --name-only --diff-filter=ACMR "$BASE...HEAD" -- '*.py' > touched.txt || true
          git diff --name-only --diff-filter=A "$BASE...HEAD" -- '*.py' > added.txt || true
          echo "Touched Python files:"; cat touched.txt
          if [ -s touched.txt ]; then
            xargs -a touched.txt -r ruff check --config ruff.toml --select F,B904,E722,B006,B023,PLE
          fi
          if [ -s added.txt ]; then
            xargs -a added.txt -r ruff format --check --config ruff.toml
          fi
