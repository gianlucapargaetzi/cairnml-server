name: release-check

# Is the next release valid? Run by hand before a release, or called by the release workflow. It publishes nothing.
#
# Plan: each of the server, the SDK (cairnml) and the agent (cairnml-agent) is either releasing or staying.
#  - Releasing: the version in its version file (apiserver/version.py, cairnml/version.py, cairnml_agent/version.py) is
#    higher than its latest release tag, and there are commits since. It is used at its main.
#  - Staying: used at its latest release tag. Commits that are not bumped are only reported.
# Then the three are tested together at exactly those commits. No PyPI package of this project is installed.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      require_release:
        description: Fail when none of the three is releasing
        required: false
        type: boolean
        default: false
    outputs:
      server_release:
        value: ${{ jobs.plan.outputs.server_release }}
      server_ref:
        value: ${{ jobs.plan.outputs.server_ref }}
      server_version:
        value: ${{ jobs.plan.outputs.server_version }}
      sdk_release:
        value: ${{ jobs.plan.outputs.sdk_release }}
      sdk_ref:
        value: ${{ jobs.plan.outputs.sdk_ref }}
      sdk_version:
        value: ${{ jobs.plan.outputs.sdk_version }}
      agent_release:
        value: ${{ jobs.plan.outputs.agent_release }}
      agent_ref:
        value: ${{ jobs.plan.outputs.agent_ref }}
      agent_version:
        value: ${{ jobs.plan.outputs.agent_version }}
      web_release:
        value: ${{ jobs.plan.outputs.web_release }}
      web_ref:
        value: ${{ jobs.plan.outputs.web_ref }}
      web_version:
        value: ${{ jobs.plan.outputs.web_version }}

permissions:
  contents: read

jobs:
  plan:
    name: what is released
    runs-on: ubuntu-latest
    outputs:
      server_release: ${{ steps.plan.outputs.server_release }}
      server_ref: ${{ steps.plan.outputs.server_ref }}
      server_version: ${{ steps.plan.outputs.server_version }}
      sdk_release: ${{ steps.plan.outputs.sdk_release }}
      sdk_ref: ${{ steps.plan.outputs.sdk_ref }}
      sdk_version: ${{ steps.plan.outputs.sdk_version }}
      agent_release: ${{ steps.plan.outputs.agent_release }}
      agent_ref: ${{ steps.plan.outputs.agent_ref }}
      agent_version: ${{ steps.plan.outputs.agent_version }}
      web_release: ${{ steps.plan.outputs.web_release }}
      web_ref: ${{ steps.plan.outputs.web_ref }}
      web_version: ${{ steps.plan.outputs.web_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          path: sdk
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-agent
          path: agent
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-web
          path: web
          fetch-depth: 0
      - id: plan
        env:
          REQUIRE_RELEASE: ${{ inputs.require_release }}
        run: |
          python - <<'PY'
          import os, re, subprocess, sys, urllib.error, urllib.request
          from pathlib import Path

          def git(repo, *args):
              return subprocess.run(["git", "-C", repo, *args], capture_output=True, text=True, check=True).stdout.strip()

          def key(v):
              return tuple(int(p) for p in v.split("."))

          def latest_tag(repo, exclude=None):
              tags = [t for t in git(repo, "tag").split() if re.fullmatch(r"v\d+\.\d+\.\d+", t) and t != exclude]
              return max(tags, key=lambda t: key(t[1:]), default=None)

          def on_pypi(name, version):
              try:
                  urllib.request.urlopen(f"https://pypi.org/pypi/{name}/{version}/json")
                  return True
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return False
                  raise

          def file_version(path):
              return re.search(r"__version__ = .(.+).", open(path).read()).group(1)

          def package_version(path):
              import json
              return json.load(open(path))["version"]

          components = [
              ("server", ".", file_version("apiserver/version.py"), None),
              ("sdk", "sdk", file_version("sdk/cairnml/version.py"), "cairnml"),
              ("agent", "agent", file_version("agent/cairnml_agent/version.py"), "cairnml-agent"),
              ("web", "web", package_version("web/package.json"), None),
          ]
          # the release notes each component publishes: CHANGELOG.md at its root, with a "## <version>" section
          changelogs = {"server": ".", "sdk": "sdk", "agent": "agent", "web": "web"}
          sys.path.insert(0, ".")
          from apiserver.release.whats_new import has_section
          problems, out = [], {}
          for name, repo, version, pypi in components:
              head = git(repo, "rev-parse", "HEAD")
              last = latest_tag(repo)
              ahead = int(git(repo, "rev-list", "--count", f"{last}..HEAD")) if last else None
              lastv = last[1:] if last else None
              if name == "web" and last is None:
                  # the web app has no release tag yet: its baseline is tagged by hand, then it is released like the rest
                  releasing = False
                  print(f"{name:7} no release tag yet: tag the current version to start releasing the web app")
              else:
                  releasing = last is None or key(version) > key(lastv)
              if last and key(version) < key(lastv):
                  problems.append(f"{name}: version {version} is lower than the last release {last}")
              if releasing:
                  if last and ahead == 0:
                      problems.append(f"{name}: no commits since {last}, nothing to release")
                  if pypi and on_pypi(pypi, version):
                      problems.append(f"{name}: {version} is already on PyPI")
                  changelog = Path(changelogs[name], "CHANGELOG.md")
                  if not changelog.exists() or not has_section(changelog.read_text(), version):
                      problems.append(f"{name}: {changelog} has no section '## {version}' with the release notes")
                  ref, used = head, version
                  print(f"{name:7} RELEASING {version} (last release {last}, {ahead} commit(s) since) at {ref[:8]}")
              else:
                  ref, used = (git(repo, "rev-list", "-n", "1", last), lastv) if last else (head, version)
                  note = f", {ahead} commit(s) not bumped" if ahead else ""
                  print(f"{name:7} staying at {last} ({ref[:8]}){note}")
              out[f"{name}_release"] = "true" if releasing else "false"
              out[f"{name}_ref"] = ref
              out[f"{name}_version"] = used or ""
          if os.environ["REQUIRE_RELEASE"] == "true" and os.environ["GITHUB_REF"] != "refs/heads/main":
              problems.append("a release is started from main only")
          if os.environ["REQUIRE_RELEASE"] == "true" and not any(out[f"{n}_release"] == "true" for n in ("server", "sdk", "agent", "web")):
              problems.append("none of the four is releasing: bump a version file")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in out.items():
                  f.write(f"{k}={v}\n")
          for p in problems:
              print("PROBLEM", p)
          sys.exit(1 if problems else 0)
          PY

  server-with-sdk:
    name: server tests with the SDK
    needs: plan
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.3
        ports:
          - 6379:6379
      mongo:
        image: mongo:8.0.15
        ports:
          - 27017:27017
    env:
      CAIRNML_REDIS_SERVICE_HOST: localhost
      CAIRNML_REDIS_SERVICE_PORT: "6379"
      CAIRNML_ALLOW_CONFIG_SECRET: "1"
      CAIRNML_SECRETS_DIR: /tmp/cairnml-secrets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.server_ref }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          ref: ${{ needs.plan.outputs.sdk_ref }}
          path: sdk
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: A test secret
        run: |
          mkdir -p "$CAIRNML_SECRETS_DIR"
          echo -n test > "$CAIRNML_SECRETS_DIR/s3_secret_key"
      - run: python -m pip install --require-hashes -r apiserver/requirements.lock
      - run: python -m pip install pytest ./sdk
      - run: python -m pytest -q -m "not integration" apiserver/tests

  sdk-with-server:
    name: SDK against the server
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.server_ref }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          ref: ${{ needs.plan.outputs.sdk_ref }}
          path: sdk
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - run: python -m pip install pyhocon jinja2 "./sdk[dataset]" pytest
      - name: The committed client equals what the server's schema generates
        run: python -m apiserver.client_generator generate --target sdk --out sdk/cairnml/backend_api/services --check
      - name: The hand-written callers agree with the schema
        run: python -m apiserver.client_generator check-callers --target sdk --root sdk/cairnml --allow sdk/scripts/api-allow.txt
      - run: cd sdk && python -m pytest tests -q

  agent-with-sdk:
    name: agent tests with the SDK
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          ref: ${{ needs.plan.outputs.sdk_ref }}
          path: sdk
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-agent
          ref: ${{ needs.plan.outputs.agent_ref }}
          path: agent
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - run: python -m pip install "./sdk[gpu]"
      - run: python -m pip install ./agent -r agent/tests/requirements.txt
      - run: cd agent && python -m pytest tests -q --ignore=tests/requirements --ignore=tests/package

  ready:
    name: release is valid
    needs: [plan, server-with-sdk, sdk-with-server, agent-with-sdk]
    runs-on: ubuntu-latest
    steps:
      - run: echo "The plan is valid and the three work together at the planned commits. Nothing was published."
