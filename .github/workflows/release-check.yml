name: release-check

# Is the next release valid? Run by hand before releasing anything. It publishes nothing.
#
# It checks that the three versions are ready (bumped, not yet tagged, not yet on PyPI) and that the main branches of
# the server, the SDK (cairnml) and the agent (cairnml-agent) work together: the server's unit tests with the SDK's
# main, the SDK's client against the server's schema and tests, and the agent's tests with the SDK's main. No PyPI
# package of this project is installed.
on:
  workflow_dispatch:
    inputs:
      server_version:
        description: Version of the server to release, without the v (for example 0.0.6)
        required: true

permissions:
  contents: read

jobs:
  versions:
    name: versions are ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          path: sdk
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-agent
          path: agent
          fetch-depth: 0
      - name: Each version is new, higher than the last release, and not on PyPI
        env:
          SERVER_VERSION: ${{ inputs.server_version }}
        run: |
          python - <<'PY'
          import os, re, subprocess, sys, urllib.error, urllib.request

          def key(v):
              return tuple(int(p) for p in v.split("."))

          def last_release(repo):
              tags = subprocess.run(["git", "-C", repo, "tag"], capture_output=True, text=True, check=True).stdout.split()
              return max((t for t in tags if re.fullmatch(r"v\d+\.\d+\.\d+", t)), key=lambda t: key(t[1:]), default=None), set(tags)

          def on_pypi(name, version):
              try:
                  urllib.request.urlopen(f"https://pypi.org/pypi/{name}/{version}/json")
                  return True
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return False
                  raise

          def file_version(path, pattern):
              return re.search(pattern, open(path).read()).group(1)

          items = [
              ("server", ".", os.environ["SERVER_VERSION"], None),
              ("sdk", "sdk", file_version("sdk/cairnml/version.py", r'__version__ = .(.+).'), "cairnml"),
              ("agent", "agent", file_version("agent/cairnml_agent/version.py", r'__version__ = .(.+).'), "cairnml-agent"),
          ]
          problems = []
          for name, repo, version, pypi in items:
              last, tags = last_release(repo)
              print(f"{name}: next {version}, last release {last}")
              if not re.fullmatch(r"\d+\.\d+\.\d+", version):
                  problems.append(f"{name}: {version!r} is not a version like 1.2.3")
                  continue
              if f"v{version}" in tags:
                  problems.append(f"{name}: v{version} is already tagged: bump the version on main first")
              elif last and key(version) <= key(last[1:]):
                  problems.append(f"{name}: {version} is not higher than the last release {last}")
              if pypi and on_pypi(pypi, version):
                  problems.append(f"{name}: {version} is already on PyPI")
          for p in problems:
              print("PROBLEM", p)
          sys.exit(1 if problems else 0)
          PY

  server-with-sdk:
    name: server tests with the SDK's main
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.3
        ports:
          - 6379:6379
      mongo:
        image: mongo:8.0.15
        ports:
          - 27017:27017
    env:
      CAIRNML_REDIS_SERVICE_HOST: localhost
      CAIRNML_REDIS_SERVICE_PORT: "6379"
      CAIRNML_ALLOW_CONFIG_SECRET: "1"
      CAIRNML_SECRETS_DIR: /tmp/cairnml-secrets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          path: sdk
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: A test secret
        run: |
          mkdir -p "$CAIRNML_SECRETS_DIR"
          echo -n test > "$CAIRNML_SECRETS_DIR/s3_secret_key"
      - run: python -m pip install --require-hashes -r apiserver/requirements.lock
      - run: python -m pip install pytest ./sdk
      - run: python -m pytest -q -m "not integration" apiserver/tests

  sdk-with-server:
    name: SDK against the server's main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          path: sdk
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - run: python -m pip install pyhocon jinja2 "./sdk[dataset]" pytest
      - name: The committed client equals what the server's schema generates
        run: python -m apiserver.client_generator generate --target sdk --out sdk/cairnml/backend_api/services --check
      - name: The hand-written callers agree with the schema
        run: python -m apiserver.client_generator check-callers --target sdk --root sdk/cairnml --allow sdk/scripts/api-allow.txt
      - run: cd sdk && python -m pytest tests -q

  agent-with-sdk:
    name: agent tests with the SDK's main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          path: sdk
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-agent
          path: agent
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - run: python -m pip install "./sdk[gpu]"
      - run: python -m pip install ./agent -r agent/tests/requirements.txt
      - run: cd agent && python -m pytest tests -q --ignore=tests/requirements --ignore=tests/package

  ready:
    name: release is valid
    needs: [versions, server-with-sdk, sdk-with-server, agent-with-sdk]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Versions are ready and the mains work together. Nothing was published."
