version: "3.6"
# legacy. To be used with docker-compose v1

services:

  apiserver:
    command:
    - apiserver
    container_name: cairnml-apiserver
    image: gianlucapargaetzi/cairnml-server:latest
    restart: unless-stopped
    volumes:
    - c:/opt/cairnml/logs:/var/log/cairnml
    - c:/opt/cairnml/config:/opt/cairnml/config
    depends_on:
      - redis
      - mongo
      - elasticsearch
    environment:
      CAIRNML_ELASTIC_SERVICE_HOST: elasticsearch
      CAIRNML_ELASTIC_SERVICE_PORT: 9200
      CAIRNML_MONGODB_SERVICE_HOST: mongo
      CAIRNML_MONGODB_SERVICE_PORT: 27017
      CAIRNML_REDIS_SERVICE_HOST: redis
      CAIRNML_REDIS_SERVICE_PORT: 6379
      CAIRNML_SERVER_DEPLOYMENT_TYPE: win10
      CAIRNML__apiserver__pre_populate__enabled: "true"
      CAIRNML__apiserver__pre_populate__zip_files: "/opt/cairnml/db-pre-populate"
      CAIRNML__services__async_urls_delete__enabled: "true"
    ports:
    - "8008:8008"
    networks:
      - backend
      - frontend

  elasticsearch:
    networks:
      - backend
    container_name: cairnml-elastic
    environment:
      bootstrap.memory_lock: "true"
      cluster.name: cairnml
      cluster.routing.allocation.node_initial_primaries_recoveries: "500"
      cluster.routing.allocation.disk.watermark.low: 500mb
      cluster.routing.allocation.disk.watermark.high: 500mb
      cluster.routing.allocation.disk.watermark.flood_stage: 500mb
      discovery.type: "single-node"
      http.compression_level: "7"
      node.name: cairnml
      reindex.remote.whitelist: "'*.*'"
      xpack.security.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    image: elasticsearch:8.19.9
    restart: unless-stopped
    volumes:
      - c:/opt/cairnml/data/elastic_7:/usr/share/elasticsearch/data
      - /usr/share/elasticsearch/logs

  mongo:
    networks:
      - backend
    container_name: cairnml-mongo
    image: mongo:8.0.15
    restart: unless-stopped
    command: --setParameter internalQueryMaxBlockingSortMemoryUsageBytes=196100200
    volumes:
    - c:/opt/cairnml/data/mongo_4/db:/data/db
    - c:/opt/cairnml/data/mongo_4/configdb:/data/configdb

  redis:
    networks:
      - backend
    container_name: cairnml-redis
    image: redis:8.2.3
    restart: unless-stopped
    volumes:
    - c:/opt/cairnml/data/redis:/data

  webserver:
    command:
    - webserver
    container_name: cairnml-webserver
    image: gianlucapargaetzi/cairnml-server:latest
    restart: unless-stopped
    volumes:
    - c:/cairnml/logs:/var/log/cairnml
    depends_on:
      - apiserver
    ports:
    - "8080:8080"
    networks:
      - backend
      - frontend

  async_delete:
    depends_on:
      - apiserver
      - redis
      - mongo
      - elasticsearch
    container_name: async_delete
    image: gianlucapargaetzi/cairnml-server:latest
    networks:
      - backend
    restart: unless-stopped
    environment:
      CAIRNML_ELASTIC_SERVICE_HOST: elasticsearch
      CAIRNML_ELASTIC_SERVICE_PORT: 9200
      CAIRNML_MONGODB_SERVICE_HOST: mongo
      CAIRNML_MONGODB_SERVICE_PORT: 27017
      CAIRNML_REDIS_SERVICE_HOST: redis
      CAIRNML_REDIS_SERVICE_PORT: 6379
      PYTHONPATH: /opt/cairnml/apiserver
    entrypoint:
      - python3
      - -m
      - jobs.async_urls_delete
    volumes:
    - c:/opt/cairnml/logs:/var/log/cairnml
    - c:/opt/cairnml/config:/opt/cairnml/config

networks:
  backend:
    driver: bridge
  frontend:
    name: frontend
    driver: bridge