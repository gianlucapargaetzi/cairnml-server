version: "3.6"
# legacy. To be used with docker-compose v1

services:

  apiserver:
    command:
    - apiserver
    container_name: cairnml-apiserver
    image: cairnml/server:latest
    restart: unless-stopped
    volumes:
    - /opt/cairnml/logs:/var/log/cairnml
    - /opt/cairnml/config:/opt/cairnml/config
    depends_on:
      - redis
      - mongo
      - elasticsearch
    environment:
      CAIRNML_ELASTIC_SERVICE_HOST: elasticsearch
      CAIRNML_ELASTIC_SERVICE_PORT: 9200
      CAIRNML_MONGODB_SERVICE_HOST: mongo
      CAIRNML_MONGODB_SERVICE_PORT: 27017
      CAIRNML_REDIS_SERVICE_HOST: redis
      CAIRNML_REDIS_SERVICE_PORT: 6379
      CAIRNML_SERVER_DEPLOYMENT_TYPE: linux
      CAIRNML__apiserver__pre_populate__enabled: "true"
      CAIRNML__apiserver__pre_populate__zip_files: "/opt/cairnml/db-pre-populate"
      CAIRNML__services__async_urls_delete__enabled: "true"
    ports:
    - "8008:8008"
    networks:
      - backend
      - frontend

  elasticsearch:
    networks:
      - backend
    container_name: cairnml-elastic
    environment:
      bootstrap.memory_lock: "true"
      cluster.name: cairnml
      cluster.routing.allocation.node_initial_primaries_recoveries: "500"
      cluster.routing.allocation.disk.watermark.low: 500mb
      cluster.routing.allocation.disk.watermark.high: 500mb
      cluster.routing.allocation.disk.watermark.flood_stage: 500mb
      discovery.type: "single-node"
      http.compression_level: "7"
      node.name: cairnml
      reindex.remote.whitelist: "'*.*'"
      xpack.security.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    image: elasticsearch:8.19.9
    restart: unless-stopped
    volumes:
      - /opt/cairnml/data/elastic_7:/usr/share/elasticsearch/data
      - /usr/share/elasticsearch/logs

  mongo:
    networks:
      - backend
    container_name: cairnml-mongo
    image: mongo:8.0.15
    restart: unless-stopped
    command: --setParameter internalQueryMaxBlockingSortMemoryUsageBytes=196100200
    volumes:
    - /opt/cairnml/data/mongo_4/db:/data/db
    - /opt/cairnml/data/mongo_4/configdb:/data/configdb

  redis:
    networks:
      - backend
    container_name: cairnml-redis
    image: redis:8.2.3
    restart: unless-stopped
    volumes:
    - /opt/cairnml/data/redis:/data

  webserver:
    command:
    - webserver
    container_name: cairnml-webserver
    # environment:
    #  CAIRNML_SERVER_SUB_PATH : cairnml-web # Allow Cairnml to be served with a URL path prefix.
    image: cairnml/server:latest
    restart: unless-stopped
    depends_on:
      - apiserver
    ports:
    - "8080:80"
    networks:
      - backend
      - frontend

  async_delete:
    depends_on:
      - apiserver
      - redis
      - mongo
      - elasticsearch
    container_name: async_delete
    image: cairnml/server:latest
    networks:
      - backend
    restart: unless-stopped
    environment:
      CAIRNML_ELASTIC_SERVICE_HOST: elasticsearch
      CAIRNML_ELASTIC_SERVICE_PORT: 9200
      CAIRNML_MONGODB_SERVICE_HOST: mongo
      CAIRNML_MONGODB_SERVICE_PORT: 27017
      CAIRNML_REDIS_SERVICE_HOST: redis
      CAIRNML_REDIS_SERVICE_PORT: 6379
      PYTHONPATH: /opt/cairnml/apiserver
    entrypoint:
      - python3
      - -m
      - jobs.async_urls_delete
    volumes:
      - /opt/cairnml/logs:/var/log/cairnml
      - /opt/cairnml/config:/opt/cairnml/config

  agent-services:
    networks:
      - backend
    container_name: cairnml-agent-services
    image: cairnml/cairnml-agent-services:latest
    deploy:
      restart_policy:
        condition: on-failure
    privileged: true
    environment:
      CAIRNML_HOST_IP: ${CAIRNML_HOST_IP}
      CAIRNML_WEB_HOST: ${CAIRNML_WEB_HOST:-}
      CAIRNML_API_HOST: http://apiserver:8008
      CAIRNML_FILES_HOST: ${CAIRNML_FILES_HOST:-}
      CAIRNML_API_ACCESS_KEY: ${CAIRNML_AGENT_ACCESS_KEY:-$CAIRNML_API_ACCESS_KEY}
      CAIRNML_API_SECRET_KEY: ${CAIRNML_AGENT_SECRET_KEY:-$CAIRNML_API_SECRET_KEY}
      CAIRNML_AGENT_GIT_USER: ${CAIRNML_AGENT_GIT_USER}
      CAIRNML_AGENT_GIT_PASS: ${CAIRNML_AGENT_GIT_PASS}
      CAIRNML_AGENT_UPDATE_VERSION: ${CAIRNML_AGENT_UPDATE_VERSION:->=0.17.0}
      CAIRNML_AGENT_DEFAULT_BASE_DOCKER: "ubuntu:18.04"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      CAIRNML_WORKER_ID: "cairnml-services"
      CAIRNML_AGENT_DOCKER_HOST_MOUNT: "/opt/cairnml/agent:/root/.cairnml"
      SHUTDOWN_IF_NO_ACCESS_KEY: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/cairnml/agent:/root/.cairnml
    depends_on:
      - apiserver
    entrypoint: >
      bash -c "curl --retry 10 --retry-delay 10 --retry-connrefused 'http://apiserver:8008/debug.ping' && /usr/agent/entrypoint.sh"

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
